    else if (ui.live && ui.live.ok) {
      const v = ui.live;
      if (v.runs.length === 1 && !v.bingo) h = '<span class="ok"><b>' + esc(dispRun(v.runs[0].syms)) + '</b> ✓ +' + v.total + ' ' + TXT.pts + '</span>';
      else h = '<span class="ok"><b>' + TXT.total + ' +' + v.total + '</b> ✓ · ' + v.runs.map(function (r) { return esc(dispRun(r.syms)) + ' +' + r.score; }).join(' · ') + (v.bingo ? ' · ' + TXT.bingo + ' +' + v.bingoBonus : '') + '</span>';
    } else if (ui.live && ui.liveKind === 'warn') {
      h = '<span class="gray">' + (ui.live.err === 'E_GAP' ? TXT.placingGap : TXT.placing) + '</span>';
    } else if (ui.live) h = '<span class="bad">' + errMessage(ui.live) + '</span>';
    else h = '';
    el.innerHTML = h;
  }
  function renderTop() {
    $('sMe').innerHTML = esc(meName() + ' ' + state.scores[0]) + '<small class="tm" id="tmMe"></small>';
    $('sAi').innerHTML = esc(oppName() + ' ' + state.scores[1]) + '<small class="tm" id="tmAi"></small>';
    $('sMe').className = (!state.over && state.turn === 0) ? 'cur' : '';
    $('sAi').className = (!state.over && state.turn === 1) ? 'cur' : '';
    const spN = online ? (online.role === 'host' ? online.sp.length : (online.rsp || []).length) : 0;
    $('bagBox').textContent = TXT.bag + ': ' + state.bag.length + (spN ? ' · 👁 ' + spN : '');
    if (typeof updateClocks === 'function') updateClocks();
  }
  function hintCount() { const h = state.hint; return h.left < 0 ? '∞' : String(h.left); }
  function renderButtons() {
    const row = $('btnRow');
    if (isSpec()) { row.innerHTML = ''; return; }
    const can = myTurn();
    if (ui.mode === 'exchange') {
      row.innerHTML = '<button class="primary" id="bExOk"' + (ui.exSel.size && can ? '' : ' disabled') + '>' + TXT.exOk + ' (' + ui.exSel.size + ')</button><button id="bExNo">' + TXT.exCancel + '</button>';
      $('bExOk').onclick = doExchange; $('bExNo').onclick = function () { ui.mode = 'play'; ui.exSel.clear(); refresh(); };
      return;
    }
    const bagLow = state.bag.length < CFG.minBagForExchange;
    row.innerHTML = '<button class="primary" id="bOk">' + TXT.ok + '</button><button id="bClr">' + TXT.clear + '</button><button id="bEx">' + TXT.exch + '</button><button id="bPass">' + TXT.pass + '</button><button id="bShuf">' + TXT.shuf + '</button>' +
      (state.hint && state.hint.limit !== 0 ? '<button id="bHint" aria-label="' + TXT.hintBtn + ' (' + hintCount() + ')"><i>💡</i><span>' + TXT.hintBtn + ' (' + hintCount() + ')</span></button>' : '');
    $('bOk').disabled = !(can && ui.live && ui.live.ok);
    $('bClr').disabled = !(can && ui.pending.length);
    const ex = $('bEx'); ex.disabled = !can; ex.classList.toggle('off', can && bagLow);
    $('bPass').disabled = !can; $('bShuf').disabled = !can;
    if ($('bHint')) { $('bHint').disabled = !(can && K.hintAvailable(state)); $('bHint').onclick = openHint; }
    $('bOk').onclick = doConfirm; $('bClr').onclick = function () { clearPending(); refresh(); };
    ex.onclick = function () {
      if (!myTurn()) return;
      if (bagLow) { toast(TXT.exNoBag + ' ' + CFG.minBagForExchange + ' ' + TXT.tilesUnit); return; }
      clearPending(); ui.mode = 'exchange'; ui.exSel.clear(); ui.selId = null; refresh();
    };
    $('bPass').onclick = doPassAsk;
    $('bShuf').onclick = function () { K.shuffle(ui.rackOrder, Math.random); refresh(); };
  }
  function refresh() {
    if (!state) return;
    evaluate();
    renderTop(); renderBoard(); renderRack(); renderStatus(); renderButtons(); renderTileBar();
  }

  // ---------- การวาง/ยกตัวหมาก ----------
  function clearPending() { ui.pending = []; ui.selPend = null; ui.live = null; }
  function removePending(id) { ui.pending = ui.pending.filter(function (p) { return p.tileId !== id; }); if (ui.selPend === id) ui.selPend = null; }
  function commitPlace(id, r, c, sym) {
    removePending(id);
    ui.pending.push({ r: r, c: c, tileId: id, sym: sym });
    ui.selId = null; ui.selPend = null; ui.msg = '';
    refresh();
  }
  function placeTile(id, r, c, keepSym) {
    const tile = tileById(id); if (!tile) return;
    const idx = r * N + c;
    if (state.board[idx]) return;
    const other = pendAt(idx); if (other && other.tileId !== id) return;
    if (K.needsChoice(tile.face) && !keepSym) {
      pickSym(tile.face, null, function (sym) { if (sym) commitPlace(id, r, c, sym); });
    } else {
      const old = ui.pending.find(function (p) { return p.tileId === id; });
      commitPlace(id, r, c, keepSym && old ? old.sym : tile.face);
    }
  }
  function renderTileBar() {
    const bar = $('tileBar');
    const p = ui.selPend !== null ? ui.pending.find(function (x) { return x.tileId === ui.selPend; }) : null;
    if (!p || !myTurn()) { bar.hidden = true; return; }
    const tile = tileById(p.tileId);
    bar.hidden = false;
    bar.innerHTML = '<button id="tbLift">' + TXT.lift + '</button>' + (K.needsChoice(tile.face) ? '<button id="tbChg">' + TXT.changeVal + '</button>' : '');
    $('tbLift').onclick = function () { removePending(p.tileId); refresh(); };
    const chg = $('tbChg');
    if (chg) chg.onclick = function () { pickSym(tile.face, p.sym, function (sym) { if (sym) { p.sym = sym; ui.selPend = null; refresh(); } }); };
    positionTileBar();
  }
  function positionTileBar() {
    const bar = $('tileBar');
    if (bar.hidden) return;
    const p = ui.pending.find(function (x) { return x.tileId === ui.selPend; });
    if (!p) { bar.hidden = true; return; }
    const w = bar.offsetWidth || 160, h = bar.offsetHeight || 54;
    let x = ui.tx + (p.c + 0.5) * ui.cell - w / 2, y = ui.ty + p.r * ui.cell - h - 6;
    if (y < 4) y = ui.ty + (p.r + 1) * ui.cell + 6;
    x = Math.max(4, Math.min(ui.wrapW - w - 4, x)); y = Math.max(4, Math.min(ui.wrapH - h - 4, y));
    bar.style.left = x + 'px'; bar.style.top = y + 'px';
  }

  // ---------- โมดัล ----------
  function openModal(o) {
    const bg = document.createElement('div'); bg.className = 'mbg' + (o.sheet ? ' sheet' : '');
    const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog');
    const head = document.createElement('div'); head.className = 'mh';
    head.innerHTML = '<h3>' + esc(o.title || '') + '</h3>';
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label', TXT.close);
    head.appendChild(x); m.appendChild(head);
    const body = document.createElement('div'); body.className = 'mb';
    if (o.node) body.appendChild(o.node); else body.innerHTML = o.html || '';
    m.appendChild(body);
    const rec = { bg: bg, closed: false };
    function close(silent) {
      if (rec.closed) return; rec.closed = true;
      bg.remove(); ui.modals = ui.modals.filter(function (r) { return r !== rec; });
      if (!silent && o.onClose) o.onClose();
      if (state && $('game').hidden === false) refresh();
    }
    rec.close = close;
    if (o.buttons && o.buttons.length) {
      const f = document.createElement('div'); f.className = 'mf';
      o.buttons.forEach(function (b) {
        const el = document.createElement('button'); el.textContent = b.label; if (b.cls) el.className = b.cls;
        el.onclick = function () { close(true); if (b.onClick) b.onClick(); };
        f.appendChild(el);
      });
      m.appendChild(f);
    }
    x.onclick = function () { close(false); };
    // กัน click ที่ตามหลัง pointerup (ที่เปิดโมดัล) ตกบนฉากหลังแล้วปิดทันที
    bg.style.pointerEvents = 'none'; setTimeout(function () { bg.style.pointerEvents = ''; }, 350);
    bg.addEventListener('click', function (e) { if (e.target === bg) close(false); });
    bg.appendChild(m); $('modalRoot').appendChild(bg);
    ui.modals.push(rec);
    if (state && $('game').hidden === false) refresh();
    return rec;
  }
  // เลือกค่าของ ±, ×÷, ว่าง -> cb(sym | null)
  function pickSym(face, current, cb) {
    const choices = K.faceChoices(face);
    const box = document.createElement('div');
    let done = false, rec;
    const pick = function (sym) { if (done) return; done = true; rec.close(true); cb(sym); };
    if (face === '?') {
      box.className = 'symgrid';
      choices.forEach(function (s) {
        const b = document.createElement('button'); b.textContent = disp(s);
        if (s === current) b.className = 'primary';
        b.onclick = function () { pick(s); }; box.appendChild(b);
      });
    } else {
      box.className = 'symbig';
      choices.forEach(function (s) {
        const b = document.createElement('button'); b.textContent = disp(s);
        if (s === current) b.className = 'primary';
        b.onclick = function () { pick(s); }; box.appendChild(b);
      });
    }
    rec = openModal({ title: TXT.pickVal, node: box, sheet: true, onClose: function () { if (!done) { done = true; cb(null); } }, buttons: [{ label: TXT.cancel, onClick: function () { if (!done) { done = true; cb(null); } } }] });
  }

  // ---------- การกระทำของตา ----------
  function afterMove(summary) {
    if (online && online.role === 'host' && state.over) K.applyTimePenalty(state, online.used, CFG);
    ui.msg = summary || ''; ui.hintMark = null;
    clearPending(); ui.selId = null; ui.mode = 'play'; ui.exSel.clear();
    saveGame();
    refresh();
    if (online && online.role === 'host') hostBroadcast();
    if (state.over) { setTimeout(showEnd, 350); return; }
    if (state.turn === 1 && !online) startAi();
  }
  function doConfirm() {
    if (!myTurn() || !ui.live || !ui.live.ok) return;
    if (online && online.role === 'guest') { guestSend({ t: 'place', pl: ui.pending.map(function (p) { return [p.r, p.c, p.tileId, p.sym]; }) }); return; }
    const r = K.applyPlace(state, ui.pending);
    if (!r.ok) { toast(ERR_TH[r.err] || r.err); return; }
    state = r.state;
    afterMove('<span class="gray">' + TXT.youPlaced + ' ' + r.result.runs.map(function (x) { return esc(dispRun(x.syms)); }).join(', ') + ' ' + TXT.aiGot + ' ' + r.result.total + ' ' + TXT.pts + '</span>');
  }
  function doExchange() {
    if (!myTurn() || !ui.exSel.size) return;
    const n = ui.exSel.size;
    if (online && online.role === 'guest') { guestSend({ t: 'exch', ids: Array.from(ui.exSel) }); return; }
    const r = K.applyExchange(state, Array.from(ui.exSel));
    if (!r.ok) { toast(ERR_TH[r.err] || r.err); return; }
    state = r.state; ui.rackOrder = ui.rackOrder.map(function (id) { return id !== null && state.racks[0].some(function (t) { return t.id === id; }) ? id : null; });
    afterMove('<span class="gray">' + TXT.youExchanged + ' ' + n + ' ' + TXT.tilesUnit + '</span>');
  }
  function askResign() {
    if (!state || state.over) return;
    openModal({ title: TXT.resignTitle, html: '<p>' + (online ? TXT.resignBodyOnline : TXT.resignBody) + '</p>', buttons: [
      { label: TXT.cancel }, { label: TXT.resign, cls: 'danger', onClick: doResign }] });
  }
  function doResign() {
    if (!state || state.over) return;
    if (online && online.role === 'guest') { guestSend({ t: 'resign' }); return; }
    ui.aiToken++; ui.thinking = false; hintReset();
    const r = K.applyResign(state, 0);
    if (!r.ok) return;
    state = r.state;
    afterMove('');
  }
  function doPassAsk() {
    if (!myTurn()) return;
    openModal({ title: TXT.passTitle, html: '<p>' + TXT.passBody + '</p>', buttons: [
      { label: TXT.cancel }, { label: TXT.pass, cls: 'primary', onClick: function () {
        if (online && online.role === 'guest') { guestSend({ t: 'pass' }); return; }
        const r = K.applyPass(state); state = r.state; afterMove('<span class="gray">' + TXT.youPassed + '</span>'); } }] });
  }

  // ---------- ตัวช่วย "ช่วยคิด" ----------
  function openHint() {
    if (!myTurn() || ui.mode !== 'play' || !K.hintAvailable(state)) return;
    const html = '<p>' + TXT.hintLeft + ' <b>' + hintCount() + '</b> ' + TXT.hintTimes + '</p><ul class="hint-opts"><li><b>' + TXT.hintTipBtn + '</b> — ' + TXT.hintTipDesc + '</li><li><b>' + TXT.hintArrBtn + '</b> — ' + TXT.hintArrDesc + '</li></ul><p style="color:var(--muted);font-size:13px">' + TXT.hintNote + '</p>';
    openModal({ title: '💡 ' + TXT.hintTitle, html: html, buttons: [
      { label: TXT.hintTipBtn, cls: 'primary', onClick: function () { runHint('tip'); } },
      { label: TXT.hintArrBtn, cls: 'primary', onClick: function () { runHint('arrange'); } },
      { label: TXT.cancel }] });
  }
  // ค้นแบบเป็นช่วงๆ (ตัวขับเดียวกับ AI) แล้วทำตามชนิด: 'tip' = ไฮไลต์ / 'arrange' = วางตัวชั่วคราว
  function runHint(kind) {
    if (!myTurn() || ui.mode !== 'play' || !K.hintAvailable(state)) return;
    const token = ++ui.hintToken, st = state;
    ui.hintMark = null;
    if (kind === 'arrange') clearPending();      // ล้างตัวหมากชั่วคราวคืนแร็คก่อน
    ui.hintBusy = true; ui.hintText = TXT.hintSearching; ui.selId = null; ui.selPend = null; refresh();
    const ctl = { stop: false };
    const gen = K.hintSearch(st, (Math.random() * 4294967296) >>> 0, undefined, ctl);
    const t0 = K.now(), wallMax = CFG.hint.search.timeLimit;
    function step() {
      if (token !== ui.hintToken || state !== st) return;
      if (K.now() - t0 > wallMax) ctl.stop = true;
      const end = K.now() + CFG.ai.sliceMs;
      let r;
      try { do { r = gen.next(); } while (!r.done && K.now() < end); }
      catch (e) { if (window.console) console.error(e); r = { done: true, value: { found: false, stats: { error: true } } }; }
      if (!r.done) { setTimeout(step, 0); return; }
      const wait = Math.max(0, CFG.hint.minShowMs - (K.now() - t0));
      setTimeout(function () { finishHint(r.value, kind, st, token); }, wait);
    }
    setTimeout(step, 30);
  }
  function finishHint(res, kind, st, token) {
    if (token !== ui.hintToken || state !== st) return;
    if (!res.found) {            // ไม่มีตาเดิน: แจ้งและไม่หักจำนวนครั้ง
      ui.hintBusy = false;
      ui.msg = '<span class="bad">' + (res.stats && res.stats.timedOut ? TXT.hintTimeout : TXT.hintNone) + '</span>';
      refresh(); toast(res.stats && res.stats.timedOut ? TXT.hintTimeout : TXT.hintNone, true);
      return;
    }
    K.spendHint(state); saveGame();           // หักเฉพาะเมื่อได้ผลลัพธ์จริง
    const idxs = res.placements.map(function (q) { return q.r * N + q.c; });
    if (kind === 'tip') {
      ui.hintBusy = false; ui.hintMark = { r: res.start.r, c: res.start.c, dir: res.dir };
      ui.msg = '<b>' + TXT.hintTipMsg + (res.dir === 0 ? TXT.hintRight : TXT.hintDown) + '</b>';
      focusCells([res.start.r * N + res.start.c]);
      refresh(); toast(TXT.hintTipMsg + (res.dir === 0 ? TXT.hintRight : TXT.hintDown), true);
      return;
    }
    ui.hintText = TXT.hintPlacing; focusCells(idxs); refresh();
    let i = 0;
    (function drop() {
      if (token !== ui.hintToken || state !== st) return;
      if (i < res.placements.length) {
        const q = res.placements[i++];
        ui.pending.push({ r: q.r, c: q.c, tileId: q.tileId, sym: q.sym });
        ui.popIdx = new Set([q.r * N + q.c]); ui.msg = '';
        refresh(); setTimeout(drop, CFG.hint.dropStepMs);
      } else {
        ui.hintBusy = false; ui.popIdx = null; ui.msg = '';
        refresh();
        toast(TXT.hintDone + ' +' + res.score + ' ' + TXT.pts + ' · ' + TXT.hintDoneTail, true);
      }
    })();
  }
  function hintReset() { ui.hintToken++; ui.hintBusy = false; ui.hintMark = null; ui.popIdx = null; }

  // ---------- AI (ทำงานเป็นช่วงๆ ไม่ให้ UI ค้าง) ----------
  function startAi() {
    if (ui.thinking || !state || state.over || state.turn !== 1) return;
    const token = ++ui.aiToken, st = state;
    ui.thinking = true; ui.selId = null; ui.selPend = null; refresh();
    const seed = (Math.random() * 4294967296) >>> 0;
    const ctl = { stop: false };
    const gen = K.aiTurn(st, 1, level, seed, undefined, ctl);
    const t0 = K.now(), wallMax = CFG.ai.levels[level].timeLimit;
    function step() {
      if (token !== ui.aiToken || state !== st) return;
      if (K.now() - t0 > wallMax) ctl.stop = true;   // เพดานเวลาจริง (รวมช่วงที่คืนเธรดให้ UI)
      const end = K.now() + CFG.ai.sliceMs;
      let r;
      try {
        do { r = gen.next(); } while (!r.done && K.now() < end);
      } catch (e) {
        if (window.console) console.error(e);
        r = { done: true, value: { type: 'pass', stats: {} } };
      }
      if (!r.done) { setTimeout(step, 0); return; }
      const wait = Math.max(0, CFG.ai.thinkMinMs - (K.now() - t0));
      setTimeout(function () { finishAi(r.value, st, token); }, wait);
    }
    setTimeout(step, 40);
  }
  function finishAi(dec, st, token) {
    if (token !== ui.aiToken || state !== st || state.turn !== 1) return;
    const r = K.applyAiDecision(st, dec);
    state = r.state;
    ui.thinking = false;
    const h = state.history[state.history.length - 1];
    let msg;
    if (h.type === 'place') msg = '<b style="color:var(--ai)">' + TXT.aiPlaced + ' ' + h.texts.map(function (t) { return esc(dispText(t)); }).join(', ') + ' ' + TXT.aiGot + ' ' + h.score + ' ' + TXT.pts + '</b>';
    else if (h.type === 'exchange') msg = '<b style="color:var(--ai)">' + TXT.aiExchanged + ' ' + h.count + ' ' + TXT.tilesUnit + '</b>';
    else msg = '<b style="color:var(--ai)">' + TXT.aiPassed + '</b>';
    ui.msg = msg; ui.mode = 'play';
    saveGame();
    refresh();
    if (h.type === 'place' && state.last) focusCells(state.last.cells);
    if (window.EM && !state.over) EM.botMaybe(h.type === 'place' && h.score >= 30 ? 0.5 : h.type === 'place' ? 0.1 : 0.2, h.type === 'pass' ? 'sad' : 'taunt');
    if (state.over) setTimeout(showEnd, 700);
  }

  // ---------- จบเกม / ประวัติ ----------
  function fmtN(n) { return n < 0 ? '−' + (-n) : String(n); }
  function hintBadge() { return state.hint && state.hint.used > 0 ? '<div style="text-align:center"><span class="hbadge">💡 ' + TXT.hintUsed + ' ' + state.hint.used + ' ' + TXT.hintTimes + ' ' + TXT.hintUsedNote + '</span></div>' : ''; }
  function showEnd() {
    if (!state || !state.over || $('game').hidden) return;
    while (ui.modals.length) ui.modals[ui.modals.length - 1].close(true);
    const f = state.final;
    const win = isSpec() ? (f.winner === 0 ? esc(specNm(1)) + ' ชนะ!' : f.winner === 1 ? esc(specNm(0)) + ' ชนะ!' : TXT.draw) : f.winner === 0 ? TXT.youWin : f.winner === 1 ? (online ? TXT.friendWins : TXT.aiWins) : TXT.draw;
    const stats = online ? null : recordResult();
    (function () {
      if (!window.Arcade) return;
      const key = (online ? online.code : 's') + ':' + state.history.length + ':' + f.scores.join(',');
      if (window.__amReported === key) return; window.__amReported = key;
      const won = f.winner === 0, usedHint = state.hint && state.hint.used > 0;
      Arcade.report({ game: 'amath', cat: online ? 'online' : level, won: won, score: f.scores[0], points: won ? (online ? 5 : (usedHint ? 0 : ({ easy: 2, medium: 4, hard: 8 })[level] || 0)) : 0 });
    })();
    if (window.EM && !online && !isSpec()) EM.botMaybe(1, f.winner === 0 ? 'sad' : 'taunt');
    let html = '<div class="win">' + win + '</div>';
    const resigned = f.reason === 'resign';
    if (online) {
      if (resigned) { /* ไม่แสดงผลต่างคะแนน */ }
      else if (!isSpec() && f.winner !== 0 && f.winner !== -1) html += '<p class="lossby">' + TXT.lossBy + ' ' + fmtN(f.scores[1] - f.scores[0]) + ' ' + TXT.pts + '</p>';
    } else if (f.winner === 1) {
      // แพ้ AI: คำกวน + คำนวณผลต่างคะแนน
      html += '<div class="taunt">' + esc(pickTaunt()) + '</div>' +
        (resigned ? '<p class="lossby">' + TXT.resignedBy + '</p>' : '<p class="lossby">' + TXT.scoreFinal + ' ' + TXT.ai + ' ' + fmtN(f.scores[1]) + ' : ' + TXT.me + ' ' + fmtN(f.scores[0]) + ' · ' + TXT.lossBy + ' ' + fmtN(f.scores[1] - f.scores[0]) + ' ' + TXT.pts + '</p>');
    } else if (f.winner === 0) {
      html += '<p class="lossby" style="color:var(--okc)">' + TXT.winNth + ' ' + stats.wins + '!</p>';
    }
    html += hintBadge() + '<table class="fin"><tr><th></th><th>' + TXT.colBefore + '</th><th>' + TXT.colPen + '</th><th>' + TXT.colBonus + '</th>' + (online ? '<th>' + TXT.colTime + '</th>' : '') + '<th>' + TXT.colFinal + '</th></tr>';
    [0, 1].forEach(function (p) {
      html += '<tr><td>' + (p === 0 ? meName() : oppName()) + '</td><td>' + state.scores[p] + '</td><td>' + (f.pen[p] ? '−' + f.pen[p] : '0') + '</td><td>' + (f.bonus[p] ? '+' + f.bonus[p] : '0') + '</td>' + (online ? '<td>' + (f.tpen && f.tpen[p] ? '−' + f.tpen[p] : '0') + '</td>' : '') + '<td><b>' + fmtN(f.scores[p]) + '</b></td></tr>';
    });
    html += '</table><p class="gray" style="color:var(--muted)">' + (f.reason === 'resign' ? (isSpec() ? esc(specNm(f.winner === 0 ? 0 : 1)) + ' ยอมแพ้' : f.winner === 0 ? TXT.friendResigned : TXT.youResigned) : f.reason === 'out' ? TXT.endReasonOut : TXT.endReasonScoreless) + '</p>' +
      (online ? (online.role === 'guest' ? '<p class="statl">' + TXT.waitHostRematch + '</p>' : '') : '<p class="statl">' + statsMain(stats) + '</p><p class="statd">' + TXT.byLevelLbl + ': ' + statsDetail(stats) + '</p>');
    openModal({ title: TXT.endTitle, html: html, buttons: online
      ? (online.role === 'host' ? [{ label: TXT.leaveRoom, onClick: goMenu }, { label: TXT.again, cls: 'primary', onClick: hostRematch }] : [{ label: TXT.leaveRoom, onClick: goMenu }])
      : [{ label: TXT.toMenu, onClick: goMenu }, { label: TXT.again, cls: 'primary', onClick: function () { startNewGame(); } }] });
  }
  function showHistory() {
    let html;
    if (!state.history.length) html = '<p>' + TXT.histEmpty + '</p>';
    else {
      html = '<ul class="hl">';
      state.history.slice().reverse().forEach(function (h) {
        const who = h.p === 0 ? meName() : oppName();
        let body;
        if (h.type === 'place') body = h.texts.map(function (t) { return esc(dispText(t)); }).join(', ') + (h.bingo ? ' (' + TXT.bingo + ')' : '') + ' · <b>+' + h.score + '</b>';
        else if (h.type === 'exchange') body = TXT.exchanged + ' ' + h.count + ' ' + TXT.tilesUnit;
        else body = TXT.passed;
        html += '<li class="' + (h.p === 1 ? 'ai' : '') + '">' + TXT.turnWord + ' ' + h.n + ' · ' + who + ' · ' + body + (h.hinted ? ' · 💡×' + h.hinted : '') + '</li>';
      });
      html += '</ul>';
    }
    html = hintBadge() + html;
    openModal({ title: TXT.histTitle, html: html, sheet: true });
  }
  function showHowTo() { openModal({ title: TXT.howto, html: TXT.howHtml, buttons: [{ label: TXT.close, cls: 'primary' }] }); }

  // ---------- เมนู / เริ่มเกม / บันทึก ----------
  function saveGame() {
    if (!state) return;
    if (online) {          // ห้องออนไลน์: เจ้าของห้องเก็บสถานะจริง แขกไม่เก็บอะไร (ไม่ทับเกมเดี่ยว)
      if (online.role === 'host') { if (online.hostSpec) return; if (state.over) lsDel(LS_ROOM); else lsSet(LS_ROOM, JSON.stringify({ v: 1, code: online.code, state: state, used: online.used })); }
      return;
    }
    if (state.over) { lsDel(LS_SAVE); return; }
    if (!lsSet(LS_SAVE, JSON.stringify({ v: 1, state: state, level: level }))) { /* บันทึกไม่ได้ก็เล่นต่อได้ */ }
  }
  function loadSave() {
    try {
      const raw = lsGet(LS_SAVE); if (!raw) return null;
      const o = JSON.parse(raw);
      const s = o && o.state;
      if (!s || o.v !== 1 || !Array.isArray(s.board) || s.board.length !== N * N || !Array.isArray(s.racks) || s.over) return null;
      s.hint = K.normHint(s.hint);
      return o;
    } catch (e) { return null; }
  }
  function showScreen(name) { $('menu').hidden = name !== 'menu'; $('game').hidden = name !== 'game'; }
  function enterGame() {
    while (ui.modals.length) ui.modals[ui.modals.length - 1].close(true);
    ui.aiToken++; ui.thinking = false; ui.sending = false; hintReset(); clearPending(); ui.selId = null; ui.mode = 'play'; ui.exSel.clear(); ui.msg = ''; ui.rackOrder = [];
    state.hint = K.normHint(state.hint);
    cellSig.fill(null);
    showScreen('game');
    if (window.EM) { EM.reset(); EM.init({ send: function (em) { if (online && online.room) online.room.presence({ em: em }).catch(noop); }, bot: !online }); EM.enable(true); }
    requestAnimationFrame(function () {
      refresh(); fitView(false);
      if (state.turn === 1 && !state.over && !online) startAi();
    });
  }
  function startNewGame() {
    state = K.createGame({ firstPlayer: firstChoice === 'random' ? 'random' : firstChoice, hints: hintChoice });
    enterGame();
    saveGame();
  }
  function goMenu() {
    if (window.EM) EM.enable(false);
    onlineLeave();
    ui.aiToken++; ui.thinking = false; hintReset();
    while (ui.modals.length) ui.modals[ui.modals.length - 1].close(true);
    showScreen('menu'); renderMenu();
  }
  function renderMenu() {
    $('menuSub').textContent = TXT.menuSub; $('lblLevel').textContent = TXT.level; $('lblFirst').textContent = TXT.first;
    $('btnStart').textContent = TXT.start; $('btnHow').textContent = TXT.howto;
    const lr = $('levelRadios'); lr.innerHTML = '';
    ['easy', 'medium', 'hard'].forEach(function (k) {
      const b = document.createElement('button'); b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(level === k));
      b.innerHTML = TXT.levelNames[k] + '<small>' + TXT.levelDesc[k] + '</small>';
      b.onclick = function () { level = k; saveSettings(); renderMenu(); };
      lr.appendChild(b);
    });
    const fr = $('firstRadios'); fr.innerHTML = '';
    ['random', 'human', 'ai'].forEach(function (k) {
      const b = document.createElement('button'); b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(firstChoice === k));
      b.textContent = TXT.firstNames[k];
      b.onclick = function () { firstChoice = k; saveSettings(); renderMenu(); };
      fr.appendChild(b);
    });
    $('lblHint').textContent = TXT.hintLbl;
    const hr = $('hintRadios'); hr.innerHTML = '';
    CFG.hint.choices.forEach(function (k) {
      const b = document.createElement('button'); b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(hintChoice === k));
      b.textContent = hintLabel(k); b.dataset.hint = k;
      b.onclick = function () { hintChoice = k; saveSettings(); renderMenu(); };
      hr.appendChild(b);
    });
    const st = loadStats(), played = st.wins + st.losses + st.draws;
    $('statsLine').textContent = played ? statsMain(st) : '';
    $('statsDetail').textContent = played ? TXT.byLevelLbl + ': ' + statsDetail(st) : '';
    const sv = loadSave();
    renderRoomMenu();
    const rb = $('btnResume'); rb.hidden = !sv; rb.textContent = TXT.resume + (sv ? ' (' + TXT.levelNames[sv.level] + ')' : '');
  }
  function saveSettings() { lsSet(LS_SET, JSON.stringify({ level: level, first: firstChoice, hint: hintChoice })); }
  function loadSettings() {
    try {
      const o = JSON.parse(lsGet(LS_SET) || 'null');
      if (o && CFG.ai.levels[o.level]) level = o.level;
      if (o && ['random', 'human', 'ai'].indexOf(o.first) >= 0) firstChoice = o.first;
      if (o && CFG.hint.choices.indexOf(o.hint) >= 0) hintChoice = o.hint;
    } catch (e) { /* ใช้ค่าเริ่มต้น */ }
  }

  // ---------- การแตะ/ลาก ----------
  const SLOP = 8;
  function startGhost(face, label) {
    const g = $('ghost'); g.hidden = false; g.className = faceClass(face) + (face === '+-' || face === '*/' ? ' pair' : '');
    g.textContent = label;
  }
  function moveGhost(x, y) {
    const g = $('ghost'); g.style.left = x + 'px'; g.style.top = (y - 40) + 'px';
    return { x: x, y: y - 40 };
  }
  function setHover(rc) {
    if (ui.drag.hov !== undefined && ui.drag.hov !== null) cellEls[ui.drag.hov].classList.remove('hov');
    ui.drag.hov = null;
    if (rc) { const i = rc.r * N + rc.c; if (!state.board[i]) { const p = pendAt(i); if (!p || p.tileId === ui.drag.id) { cellEls[i].classList.add('hov'); ui.drag.hov = i; } } }
  }
  function dropTarget(x, y) {
    const el = document.elementFromPoint(x, y);
    if (el && el.closest('#zoomBtns, #tileBar')) return null;
    if (el && el.closest('#rackArea')) { const s = el.closest('.slot'); return { type: 'rack', slot: s ? +s.dataset.i : null }; }
    const rc = wrap.getBoundingClientRect();
    if (x >= rc.left && x <= rc.right && y >= rc.top && y <= rc.bottom) { const c = cellAtPoint(x, y); if (c) return { type: 'board', r: c.r, c: c.c }; }
    return null;
  }
  let autoTimer = null;
  function autoScroll() {
    const d = ui.drag; if (!d || !d.active) return;
    const rc = wrap.getBoundingClientRect(), gx = d.gx, gy = d.gy, m = 36, sp = 9;
    let dx = 0, dy = 0;
    if (gx >= rc.left && gx <= rc.right && gy >= rc.top && gy <= rc.bottom) {
      if (gx < rc.left + m) dx = sp; else if (gx > rc.right - m) dx = -sp;
      if (gy < rc.top + m) dy = sp; else if (gy > rc.bottom - m) dy = -sp;
    }
    // ต้องค้างที่ขอบ ~0.3 วินาทีก่อน จึงเลื่อนอัตโนมัติ (กันเลื่อนเองตอนลากผ่าน)
    if (!dx && !dy) { d.edgeSince = 0; return; }
    const now = K.now();
    if (!d.edgeSince) d.edgeSince = now;
    if (now - d.edgeSince < 300) return;
    ui.tx += dx; ui.ty += dy; applyView(false); setHover(cellAtPoint(gx, gy));
  }
  function beginPress(src, id, e) {
    if (ui.press) return;
    ui.press = { src: src, id: id, x0: e.clientX, y0: e.clientY, pid: e.pointerId, moved: false };
    window.addEventListener('pointermove', onPressMove, true);
    window.addEventListener('pointerup', onPressUp, true);
    window.addEventListener('pointercancel', onPressCancel, true);
  }
  function endPress() {
    window.removeEventListener('pointermove', onPressMove, true);
    window.removeEventListener('pointerup', onPressUp, true);
    window.removeEventListener('pointercancel', onPressCancel, true);
    ui.press = null;
  }
  function onPressMove(e) {
    const p = ui.press; if (!p || e.pointerId !== p.pid) return;
    e.preventDefault();
    if (!p.moved) {
      if (Math.hypot(e.clientX - p.x0, e.clientY - p.y0) <= SLOP) return;
      if (ui.mode === 'exchange') return;
      p.moved = true;
      const tile = tileById(p.id); if (!tile) { endPress(); return; }
      const pe = ui.pending.find(function (q) { return q.tileId === p.id; });
      ui.drag = { id: p.id, src: p.src, active: true, hov: null, gx: 0, gy: 0 };
      ui.selPend = null; renderTileBar();
      startGhost(tile.face, pe ? disp(pe.sym) : faceLabel(tile.face));
      grid.classList.remove('anim');
      autoTimer = setInterval(autoScroll, 16);
    }
    if (ui.drag) {
      const g = moveGhost(e.clientX, e.clientY);
      ui.drag.gx = g.x; ui.drag.gy = g.y; ui.drag.fx = e.clientX; ui.drag.fy = e.clientY;
      setHover(cellAtPoint(g.x, g.y));
    }
  }
  function onPressUp(e) {
    const p = ui.press; if (!p || e.pointerId !== p.pid) return;
    const wasDrag = !!ui.drag;
    const d = ui.drag;
    clearInterval(autoTimer); autoTimer = null;
    if (d) { setHover(null); $('ghost').hidden = true; ui.drag = null; }
    endPress();
    if (!wasDrag) { tapPress(p); return; }
    // ใช้ตำแหน่งนิ้วตัดสินพื้นที่: นิ้วบนแร็ค = คืนแร็ค, นิ้วบนกระดาน = ใช้ช่องใต้ ghost, ที่อื่น = ยกเลิก
    let t = dropTarget(d.fx, d.fy);
    if (t && t.type === 'board') { t = dropTarget(d.gx, d.gy); if (t && t.type !== 'board') t = null; }
    if (!t) { refresh(); return; }
    if (t.type === 'board') {
      const i = t.r * N + t.c;
      if (!state.board[i]) { const o = pendAt(i); if (!o || o.tileId === p.id) placeTile(p.id, t.r, t.c, p.src === 'board'); else refresh(); }
      else refresh();
    } else if (t.type === 'rack') {
      if (p.src === 'board') removePending(p.id);
      if (t.slot !== null) {
        const from = ui.rackOrder.indexOf(p.id);
        if (from >= 0 && from !== t.slot) { const tmp = ui.rackOrder[t.slot]; ui.rackOrder[t.slot] = p.id; ui.rackOrder[from] = tmp; }
      }
      refresh();
    } else refresh();
  }
  function onPressCancel(e) {
    const p = ui.press; if (!p || e.pointerId !== p.pid) return;
    clearInterval(autoTimer); autoTimer = null;
    if (ui.drag) { setHover(null); $('ghost').hidden = true; ui.drag = null; }
    endPress(); refresh();
  }
  // แตะ (ไม่ลาก) ที่ตัวหมากในแร็คหรือตัวหมากชั่วคราว
  function tapPress(p) {
    if (!myTurn() && ui.mode !== 'exchange') return;
    if (p.src === 'rack') {
      if (ui.mode === 'exchange') { if (ui.exSel.has(p.id)) ui.exSel.delete(p.id); else ui.exSel.add(p.id); refresh(); return; }
      ui.selId = ui.selId === p.id ? null : p.id; ui.selPend = null; refresh();
    } else {
      ui.selPend = ui.selPend === p.id ? null : p.id; ui.selId = null; refresh();
    }
  }
  $('rack').addEventListener('pointerdown', function (e) {
    const el = e.target.closest('.rt'); if (!el || (!myTurn() && ui.mode !== 'exchange')) return;
    if (e.button !== undefined && e.button > 0) return;
    beginPress('rack', +el.dataset.id, e);
  });

  // --- กระดาน: เลื่อน / pinch / แตะ ---
  const ptrs = new Map();
  let gest = null;
  function boardTap(x, y) {
    ui.selPend = null;
    const c = cellAtPoint(x, y);
    if (!c) { refresh(); return; }
    const idx = c.r * N + c.c;
    const canPlace = myTurn() && ui.mode === 'play';
    if (state.board[idx]) {
      const b = state.board[idx];
      if (ui.cell < 30) focusOn(c.r, c.c, 44, true);
      else toast(TXT.cellInfo + ' ' + disp(b.sym) + (b.blank ? ' (?)' : '') + ' · ' + b.pts + ' ' + TXT.pts);
      refresh(); return;
    }
    if (ui.cell < 30) { focusOn(c.r, c.c, 44, true); refresh(); return; }   // โหมดพอดีจอ: แตะ = ซูมเข้า
    if (canPlace && ui.selId !== null) placeTile(ui.selId, c.r, c.c, false);
    else {
      if (premium[idx] && !ui.pending.length) toast(TXT.premiumNames[premium[idx]]);
      refresh();
    }
  }
  wrap.addEventListener('pointerdown', function (e) {
    if (e.target.closest('#zoomBtns, #tileBar')) return;
    if (ui.press) return;
    if (e.button !== undefined && e.button > 0) return;
    grid.classList.remove('anim');
    // กดบนตัวหมากชั่วคราว -> แตะ/ลากตัวหมาก
    if (ptrs.size === 0 && myTurn() && ui.mode === 'play') {
      const c = cellAtPoint(e.clientX, e.clientY);
      if (c) { const p = pendAt(c.r * N + c.c); if (p) { beginPress('board', p.tileId, e); return; } }
    }
    try { wrap.setPointerCapture(e.pointerId); } catch (err) { /* ไม่เป็นไร */ }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) gest = { type: 'pan', x0: e.clientX, y0: e.clientY, tx0: ui.tx, ty0: ui.ty, moved: false, pid: e.pointerId };
    else if (ptrs.size === 2) {
      const a = Array.from(ptrs.values()), rc = wrap.getBoundingClientRect();
      const mx = (a[0].x + a[1].x) / 2 - rc.left, my = (a[0].y + a[1].y) / 2 - rc.top;
      gest = { type: 'pinch', d0: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1, cell0: ui.cell, wx: (mx - ui.tx) / ui.cell, wy: (my - ui.ty) / ui.cell, moved: true };
    }
  });
  wrap.addEventListener('pointermove', function (e) {

    const pl = host ? on.pl : on.rpl, sp = host ? on.sp : on.rsp, hid = host ? on.meId : on.hid;
    const li = function (id, fb) { return '<li><span>' + esc(pName(on, id, fb)) + (id === on.meId ? ' (คุณ)' : '') + '</span>' + (id === hid ? '<em>เจ้าของห้อง</em>' : '') + '</li>'; };
    const pls = pl.map(function (id, i) { return li(id, 'ผู้เล่น ' + (i + 1)); }).join('') + (pl.length < 2 ? '<li class="empty"><span>ว่าง — รอผู้เล่น</span></li>' : '');
    const sps = sp.map(function (id, i) { return li(id, 'คนดู ' + (i + 1)); }).join('') || '<li class="empty"><span>ยังไม่มีคนดู</span></li>';
    const full = pl.length >= 2;
    box.innerHTML = '<p style="margin:0;text-align:center">' + TXT.lobbyCode + '</p><div class="codebig">' + on.code + '</div>' +
      '<p class="statd" style="margin:0;text-align:center">⏱ ' + TXT.clockInfo + ' ' + (CFG.online.clockMs / 60000) + ' ' + TXT.minWord + ' · ' + TXT.overInfo + '</p>' +
      (host ? '<p class="lbl2">คุณเป็น</p><div class="rolechips"><button data-w="p" aria-pressed="' + (on.want === 'p') + '">ผู้เล่น</button><button data-w="s" aria-pressed="' + (on.want === 's') + '">คนดู</button></div>'
            : '<p class="joinmsg">คุณเข้ามาเป็น <b>' + (on.want === 's' ? 'คนดู' : 'ผู้เล่น') + '</b> · รอเจ้าของห้องกดเริ่มเกม…</p>') +
      '<p class="lbl2">ผู้เล่น ' + pl.length + '/2</p><ul class="plist">' + pls + '</ul><p class="lbl2">คนดู ' + sp.length + '/' + MAXSP + '</p><ul class="plist">' + sps + '</ul>' +
      '<div class="lbtns"><button class="rbtn" id="lbCopy">' + TXT.copy + '</button>' + (host ? '<button class="primary rbtn" id="lbStart"' + (full ? '' : ' disabled') + '>' + (full ? 'เริ่มเกม' : 'รอผู้เล่นให้ครบ 2 คน') + '</button>' : '') + '</div>';
    $('lbCopy').onclick = function () {
      let q; try { q = navigator.clipboard.writeText(on.code); } catch (e) { q = null; }
      if (q && q.then) q.then(function () { toast(TXT.copied); }, function () { toast(TXT.copyFail); }); else toast(TXT.copyFail);
    };
    if (host) {
      box.querySelectorAll('.rolechips button').forEach(function (b) { b.onclick = function () { setWant(on, b.dataset.w); }; });
      $('lbStart').onclick = function () { hostStart(on); };
    }
  }
  function setWant(on, w) {
    if (online !== on || on.role !== 'host' || on.started) return;
    if (w === 'p' && on.pl.length >= 2 && on.pl.indexOf(on.meId) < 0) { toast('ที่นั่งผู้เล่นเต็มแล้ว (2 คน)'); return; }
    if (w === 's' && on.sp.length >= MAXSP && on.sp.indexOf(on.meId) < 0) { toast('ที่นั่งคนดูเต็มแล้ว (สูงสุด ' + MAXSP + ' คน)'); return; }
    on.want = w; rosterHost(on); hostBroadcast(); fillLobby(on);
  }
  function showLobbyModal(on, cancel) {
    const box = document.createElement('div'); on.lobbyBox = box;
    on.lobby = openModal({ title: TXT.lobbyTitle, node: box, onClose: cancel, buttons: [{ label: on.role === 'host' ? 'ปิดห้อง' : 'ออก', onClick: cancel }] });
    fillLobby(on);
  }

  // ----- เจ้าของห้อง -----
  function onlineCreate() { if (roomNS && !online) onlineHostOpen(genCode(), null); }
  function onlineResumeHost() { const sv = loadRoomSave(); if (!sv) { renderMenu(); return; } if (roomNS && !online) onlineHostOpen(String(sv.code), sv.state, sv.used); }
  function onlineHostOpen(code, saved, used) {
    const on = online = newOnline('host', code);
    on.ep = on.epMine;
    if (Array.isArray(used) && used.length === 2) on.used = [Math.max(0, +used[0] || 0), Math.max(0, +used[1] || 0)];
    roomNS.join(roomName(code)).then(function (room) {
      if (online !== on) { room.leave().catch(noop); return; }
      on.room = room;
      on.unsub = room.onPeers(function (ch) { hostOnPeers(on, ch, saved); }, noop);
      room.presence({ role: 'host', code: code, nm: myNm(), want: 'p', jt: on.jt, pl: [], sp: [], go: 0, p0: null, p1: null, st: null, st0: null }).catch(noop);
      if (saved) { on.started = true; on.seat = ['*', null]; state = saved; state.hint = K.newHint(0); enterGame(); hostBroadcast(); }
      else showLobby(on);
    }, function (e) { if (online === on) online = null; toast(joinErrText(e)); renderMenu(); });
  }
  function showLobby(on) {
    const cancel = function () { if (online === on) { onlineLeave(); renderMenu(); } };
    showLobbyModal(on, cancel);
  }
  function emPeers(on, ch) {
    if (!window.EM) return;
    const m = {}; ch.peers.forEach(function (p) { m[p.peer] = p.presence || {}; });
    EM.onPeers(m, on.meId, function (id) { return (m[id] && m[id].nm) || 'เพื่อน'; });
  }
  function hostOnPeers(on, ch, saved) {
    if (online !== on) return;
    const ps = ch.peers;
    // เลขห้องซ้ำ: มีเจ้าของห้องอีกคนอยู่แล้ว
    if (ps.some(function (p) { return !(p.isMe && p.sameTab) && p.presence && p.presence.role === 'host' && p.presence.code === on.code; })) {
      onlineLeave(); toast(TXT.roomTaken); if (!$('game').hidden) goMenu(); else renderMenu(); return;
    }
    const me = ps.find(function (p) { return p.isMe; }); if (me) on.meId = me.peer;
    emPeers(on, ch);
    on.peers = {}; ps.forEach(function (p) { on.peers[p.peer] = p.presence || {}; on.by[p.peer] = p.by; });
    if (!on.meId) return;
    const ch2 = rosterHost(on);
    // ชื่อคู่แข่ง (เจ้าของห้องที่เป็นผู้เล่น)
    if (!on.hostSpec && on.started && on.seat[1] && on.peers[on.seat[1]]) setOpp(on.peers[on.seat[1]].nm);
    if (ch2) hostBroadcast();
    if (!on.started) fillLobby(on);
    else {
      if (ch2) refresh();
      for (let s = 0; s < 2; s++) {
        const id = on.seat[s]; if (!id || id === '*') continue;
        const act = on.peers[id] && on.peers[id].act;
        if (act && typeof act === 'object' && Number.isInteger(act.n) && act.ep === on.ep && act.n > on.la[s]) { on.la[s] = act.n; hostHandleAct(on, act, s); }
      }
    }
  }
  function hostStart(on) {
    if (online !== on || on.started || on.pl.length < 2) return;
    if (on.pl.some(function (id) { return id !== on.meId && !on.peers[id]; })) { toast('ผู้เล่นไม่ครบ'); return; }
    if (on.lobby) { on.lobby.close(true); on.lobby = null; }
    on.started = true; on.hostSpec = on.want === 's';
    on.seat = on.hostSpec ? [on.pl[0], on.pl[1]] : ['*', on.pl.find(function (id) { return id !== on.meId; })];
    on.la = [0, 0]; on.ak = [null, null]; on.used = [0, 0];
    rosterHost(on);
    setA(K.createGame({ firstPlayer: 'random', hints: 0 }));
    if (!on.hostSpec) setOpp(pName(on, on.seat[1], ''));
    enterGame(); saveGame(); hostBroadcast();
    toast(TXT.friendJoined);
  }
  function hostBroadcast() {
    const on = online; if (!on || on.role !== 'host' || !on.room) return;
    const S = on.started ? A() : null;
    const sid = function (x) { return x === '*' ? on.meId : (x || null); };
    const base = { role: 'host', code: on.code, nm: myNm(), want: on.want, jt: on.jt, pl: on.pl, sp: on.sp, go: on.started ? 1 : 0,
      p0: sid(on.seat[0]), p1: sid(on.seat[1]), pn: [pName(on, on.seat[0] || '', ''), pName(on, on.seat[1] || '', '')], st: null, st0: null };
    if (S) {
      on.seq++;
      const v = K.makeGuestView(S, on.seq, on.ak[1], CFG); v.ep = on.ep;
      v.cu = [Math.round(on.used[1]), Math.round(on.used[0])];   // มุมมองที่นั่ง 1: [ตัวเอง, อีกฝ่าย]
      base.st = v;
      if (on.hostSpec) {
        const v0 = K.makeGuestView(K.mirror(S), on.seq, on.ak[0], CFG); v0.ep = on.ep;
        v0.cu = [Math.round(on.used[0]), Math.round(on.used[1])];
        base.st0 = v0;
      }
    }
    on.room.presence(base).catch(noop);
  }
  function moveMsg(h, mine) {
    if (h.type === 'place') {
      const t = h.texts.map(function (x) { return esc(dispText(x)); }).join(', ');
      return mine ? '<span class="gray">' + TXT.youPlaced + ' ' + t + ' ' + TXT.aiGot + ' ' + h.score + ' ' + TXT.pts + '</span>'
        : '<b style="color:var(--ai)">' + TXT.friendPlaced + ' ' + t + ' ' + TXT.aiGot + ' ' + h.score + ' ' + TXT.pts + '</b>';
    }
    if (h.type === 'exchange') return mine ? '<span class="gray">' + TXT.youExchanged + ' ' + h.count + ' ' + TXT.tilesUnit + '</span>' : '<b style="color:var(--ai)">' + TXT.friendExchanged + ' ' + h.count + ' ' + TXT.tilesUnit + '</b>';
    return mine ? '<span class="gray">' + TXT.youPassed + '</span>' : '<b style="color:var(--ai)">' + TXT.friendPassed + '</b>';
  }
  // คำสั่งจากผู้เล่นที่นั่ง seat (0/1) ที่ไม่ใช่เจ้าของห้อง
  function hostHandleAct(on, act, seat) {
    const S = A();
    let r;
    if (seat === 1) r = K.applyRemoteAct(S, act, CFG);
    else { r = K.applyRemoteAct(K.mirror(S), act, CFG); if (r.ok) r.state = K.mirror(r.state); }
    if (!r.ok) { on.ak[seat] = { n: act.n, ok: 0, e: r.err }; hostBroadcast(); return; }
    const ns = r.state;
    if (ns.over) K.applyTimePenalty(ns, on.used, CFG);
    setA(ns);
    const h = state.history[state.history.length - 1];
    if (act.t !== 'resign') ui.msg = isSpec() ? specMsg(h) : moveMsg(h, false);
    ui.mode = 'play';
    saveGame(); refresh();
    if (act.t !== 'resign' && h.type === 'place' && state.last) focusCells(state.last.cells);
    on.ak[seat] = { n: act.n, ok: 1 };
    hostBroadcast();
    if (state.over) setTimeout(showEnd, 700);
  }
  function hostRematch() {
    if (!online || online.role !== 'host') return;
    if (!(online.seat[0] && online.seat[1])) { toast(TXT.friendGone); return; }
    setA(K.createGame({ firstPlayer: 'random', hints: 0 })); online.used = [0, 0];
    enterGame(); saveGame(); hostBroadcast();
  }

  // ----- แขก (ผู้เล่นหรือคนดู) -----
  function onlineJoinDialog() {
    if (!roomNS || online || ui.modals.length) return;
    const box = document.createElement('div');
    const inp = document.createElement('input'); inp.className = 'codein'; inp.type = 'text'; inp.inputMode = 'numeric'; inp.maxLength = 6;
    inp.placeholder = TXT.joinPh; inp.setAttribute('autocomplete', 'off'); inp.setAttribute('aria-label', TXT.joinTitle);
    inp.value = lsGet(LS_CODE) || '';
    const msg = document.createElement('p'); msg.className = 'joinmsg';
    const go = document.createElement('button'); go.className = 'primary rbtn'; go.textContent = 'เข้าเล่น';
    const goS = document.createElement('button'); goS.className = 'rbtn'; goS.textContent = 'เข้าดู';
    box.appendChild(inp); box.appendChild(msg); box.appendChild(go); box.appendChild(goS);
    const rec = openModal({ title: TXT.joinTitle, node: box, buttons: [{ label: TXT.cancel }] });
    const err = function (t) { msg.textContent = t; msg.className = 'joinmsg err'; go.disabled = false; goS.disabled = false; };
    const submit = function (want) {
      const code = inp.value.replace(/\D/g, '');
      if (!validCode(code)) { err(TXT.joinBad); return; }
      go.disabled = true; goS.disabled = true; msg.className = 'joinmsg'; msg.textContent = TXT.joining;
      onlineGuestOpen(code, function (e) { if (e) err(e); else rec.close(true); }, want);
    };
    go.onclick = function () { submit('p'); }; goS.onclick = function () { submit('s'); };
    inp.addEventListener('input', function () { inp.value = inp.value.replace(/\D/g, '').slice(0, 6); });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit('p'); });
    setTimeout(function () { try { inp.focus(); inp.select(); } catch (e) { /* ไม่เป็นไร */ } }, 60);
  }
  function guestFail(on, text) {
    if (online !== on) return;
    const cb = on.cb; on.cb = null;
    onlineLeave();
    if (cb) cb(text); else { toast(text); if (!$('game').hidden) goMenu(); else renderMenu(); }
  }
  function onlineGuestOpen(code, cb, want) {
    const on = online = newOnline('guest', code); on.cb = cb; on.want = want === 's' ? 's' : 'p';
    roomNS.join(roomName(code)).then(function (room) {
      if (online !== on) { room.leave().catch(noop); return; }
      on.room = room;
      on.unsub = room.onPeers(function (ch) { guestOnPeers(on, ch); }, noop);
      room.presence({ role: 'guest', act: null, nm: myNm(), want: on.want, jt: on.jt }).catch(noop);
      on.joinTimer = setTimeout(function () { if (online === on && !on.accepted) guestFail(on, TXT.roomNotFound); }, CFG.online.joinWaitMs);
    }, function (e) { if (online === on) { online = null; cb(joinErrText(e)); } });
  }
  function guestOnPeers(on, ch) {
    if (online !== on) return;
    const host = ch.peers.find(function (p) { return !p.isMe && p.presence && p.presence.role === 'host' && p.presence.code === on.code; });
    const me = ch.peers.find(function (p) { return p.isMe && p.sameTab; });
    on.peers = {}; ch.peers.forEach(function (p) { on.peers[p.peer] = p.presence || {}; });
    if (me) on.meId = me.peer;
    emPeers(on, ch);
    if (!host) {
      if (on.started && !on.hostGone) { on.hostGone = true; toast(TXT.hostGone); refresh(); }
      return;
    }
    if (on.hostGone) { on.hostGone = false; toast(TXT.hostBack); refresh(); }
    const pr = host.presence;
    on.pn = pr.pn || []; on.rpl = pr.pl || []; on.rsp = pr.sp || []; on.hid = host.peer;
    if (!me) return;
    const seat = pr.p1 === me.peer ? 1 : pr.p0 === me.peer ? 0 : -1;
    const isSp = on.rsp.indexOf(me.peer) >= 0, inPl = on.rpl.indexOf(me.peer) >= 0;
    if (seat < 0 && !isSp && !inPl) {
      // ยังไม่ได้ที่นั่ง: รอสักพักก่อนตัดสินว่าเต็ม (กรณีรีโหลดแล้วตัวเก่ายังไม่หมดอายุ)
      if (!on.fullTimer) on.fullTimer = setTimeout(function () {
        on.fullTimer = 0;
        if (online === on && !on.accepted) guestFail(on, on.want === 's' ? 'ที่นั่งคนดูเต็มแล้ว (สูงสุด ' + MAXSP + ' คน)' : TXT.roomFull);
      }, 3000);
      return;
    }
    clearTimeout(on.fullTimer); on.fullTimer = 0; clearTimeout(on.joinTimer);
    on.seat = seat >= 0 ? seat : (isSp ? -1 : null);
    if (seat >= 0) setOpp(nmOk(pr.pn && pr.pn[1 - seat]));
    if (!on.accepted) { on.accepted = true; const cb = on.cb; on.cb = null; if (cb) cb(null); }
    if (!pr.go) {
      if (!on.lobby || on.lobby.closed) { if (!on.started) showLobbyModal(on, function () { if (online === on) { onlineLeave(); renderMenu(); } }); }
      else fillLobby(on);
      return;
    }
    const v = seat === 0 ? pr.st0 : pr.st;
    if (v && typeof v === 'object') guestApplyView(on, v);
  }
  function guestApplyView(on, v) {
    if (v.ep !== on.ep) { on.ep = v.ep; on.seq = 0; }
    if (!(v.q > on.seq)) return;
    let ns;
    try { ns = K.fromGuestView(v, CFG); } catch (e) { return; }
    on.seq = v.q;
    if (on.seat === -1) ns.racks[0] = [];
    const prev = state, prevHn = on.hn; on.hn = v.hn | 0;
    if (Array.isArray(v.cu) && v.cu.length === 2) on.cu = [Math.max(0, +v.cu[0] || 0), Math.max(0, +v.cu[1] || 0)];
    clearTimeout(on.joinTimer);
    const fresh = !on.started || !prev || (prev.over && !ns.over) || on.hn < prevHn;
    state = ns;
    if (fresh) {
      on.started = true; clearTimeout(on.ackTimer); lsSet(LS_CODE, on.code);
      enterGame();
      if (ns.over) setTimeout(showEnd, 350);
      return;
    }
    const ak = v.ak, moved = on.hn > prevHn;
    if (ui.sending && ak && ak.n === on.actN) {
      ui.sending = false; clearTimeout(on.ackTimer);
      if (!ak.ok) toast(ERR_TH[ak.e] || ak.e || TXT.roomRetry);
    }
    const h = ns.history[ns.history.length - 1];
    if (moved) {
      clearPending(); ui.selId = null; ui.selPend = null; ui.mode = 'play'; ui.exSel.clear(); ui.hintMark = null;
      if (h) ui.msg = on.seat === -1 ? specMsg(h) : moveMsg(h, h.p === 0);
    }
    ui.pending = ui.pending.filter(function (p) { return ns.racks[0].some(function (t) { return t.id === p.tileId; }); });
    refresh();
    if (moved && h && h.type === 'place' && ns.last && (on.seat === -1 || h.p === 1)) focusCells(ns.last.cells);
    if (ns.over) setTimeout(showEnd, 700);
  }
  function guestSend(act) {
    const on = online; if (!on || !on.room) return;
    act.n = ++on.actN; act.ep = on.ep;
    ui.sending = true; ui.selId = null; ui.selPend = null; refresh();
    on.room.presence({ act: act }).catch(function () { if (online === on && ui.sending) { ui.sending = false; toast(TXT.roomRetry); refresh(); } });
    clearTimeout(on.ackTimer);
    on.ackTimer = setTimeout(function () { if (online === on && ui.sending) { ui.sending = false; toast(TXT.noAck); refresh(); } }, CFG.online.ackMs);
  }
  // กันกดออกโดยไม่ตั้งใจ (ลิงก์เมนู Arcade / ปิดแท็บ)
  window.__leaveGuard = function () {
    if (online) return { msg: online.started ? (isSpec() ? 'คุณจะเลิกดูแมตช์นี้' : 'การออกระหว่างเล่นนับว่ายอมแพ้') : 'คุณจะออกจากห้องนี้' };
    if (state && !state.over && !$('game').hidden) return { msg: 'เกมนี้ถูกเซฟไว้ เล่นต่อได้จากเมนู', soft: true };
    return null;
  };

  // ---------- เริ่มโปรแกรม ----------
  buildGrid(); bindStatic(); loadSettings(); renderMenu(); showScreen('menu'); initRoom(); setInterval(clockTick, 250);
  // ตะขอสำหรับทดสอบ/ดีบัก (ไม่กระทบการเล่น)
  if (location.hash === '#debug') window.__amath = { get state() { return state; }, ui: ui, K: K, load: function (s) { state = s; enterGame(); }, start: function (seed, first) { state = K.createGame({ seed: seed, firstPlayer: first }); enterGame(); }, view: function () { return { cell: ui.cell, tx: ui.tx, ty: ui.ty }; }, get online() { return online; }, refresh: refresh };
})();
</script>
<script>
(function(){
  var nv=document.getElementById('gnav');function sh(){if(nv)document.documentElement.style.setProperty('--gnh',nv.offsetHeight+'px');}sh();addEventListener('resize',sh);(function(){var l=nv&&nv.querySelector('.glinks'),a=l&&l.querySelector('[aria-current]');if(a)l.scrollLeft=Math.max(0,a.offsetLeft-(l.clientWidth-a.offsetWidth)/2);})();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sh);
  /* กันออกจากแมตช์โดยไม่ตั้งใจ: คลิกลิงก์ในแถบเมนูแล้วถามก่อน (แต่ละเกมกำหนด window.__leaveGuard) */
  function ask(g,go){
    var d=document.createElement('div');d.id='gleave';
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(5,10,16,.72);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Sarabun,system-ui,sans-serif';
    d.innerHTML='<div role="alertdialog" aria-modal="true" style="background:#1e2d3b;color:#eaf0f4;border:1px solid #2a3b4b;border-radius:16px;padding:22px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px"><b style="font-size:20px">ออกจากหน้านี้?</b><span style="color:#b6c6d3"></span><div style="display:flex;gap:8px"><button type="button" data-y style="flex:1;padding:10px;border-radius:10px;border:0;background:#ffcf5a;color:#2a2007;font:700 15px inherit;cursor:pointer">ออก</button><button type="button" data-n style="flex:1;padding:10px;border-radius:10px;border:1px solid #2a3b4b;background:#2a3b4b;color:#eaf0f4;font:700 15px inherit;cursor:pointer">อยู่ต่อ</button></div></div>';
    d.querySelector('span').textContent=g.msg||'';
    document.body.appendChild(d);
    var n=d.querySelector('[data-n]');n.focus();
    function close(){d.remove();}
    n.onclick=close;d.onclick=function(e){if(e.target===d)close();};
    d.querySelector('[data-y]').onclick=function(){close();try{if(window.__leaveNow)window.__leaveNow();}catch(e){}go();};
    d.onkeydown=function(e){if(e.key==='Escape')close();};
  }
  function guard(){try{return window.__leaveGuard?window.__leaveGuard():null;}catch(e){return null;}}
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('#gnav a[href]'),o=e.target.closest&&e.target.closest('#gOut');
    if(!a&&!o)return;if(a&&(e.ctrlKey||e.metaKey||e.shiftKey||a.target==='_blank'))return;
    var g=guard();if(!g)return;
    e.preventDefault();e.stopImmediatePropagation();
    ask(g,function(){if(a)location.href=a.href;else if(window.Arcade)Arcade.logout();});
  },true);
  addEventListener('beforeunload',function(e){var g=guard();if(g&&!g.soft){e.preventDefault();e.returnValue='';}});
  var el=document.getElementById('gwho');if(!el||!window.Arcade)return;
