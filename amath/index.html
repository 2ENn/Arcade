<title>A-Math เอแมท</title>

<script>
/* ดอกไม้ไฟกระดาษ (เฉลิมฉลองตอนชนะ) */
window.Confetti=(function(){
  var cv,cx,parts=[],raf=0,t0=0;
  function loop(ts){
    if(!t0)t0=ts;var dt=Math.min(32,ts-(loop.l||ts));loop.l=ts;
    cx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(function(p){
      p.vy+=0.0016*dt*dpr();p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.995;p.r+=p.vr*dt;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,Math.min(1,(2600-(ts-t0))/700));
      cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
    });
    if(ts-t0<2600)raf=requestAnimationFrame(loop);else stop();
  }
  function dpr(){return window.devicePixelRatio||1;}
  function stop(){cancelAnimationFrame(raf);raf=0;if(cv&&cv.parentNode)cv.parentNode.removeChild(cv);cv=null;parts=[];t0=0;loop.l=0;}
  function burst(colors){
    try{
      if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      stop();colors=colors||['#ffcf5a','#2f9e6a','#2a9cc2','#ff917c','#f3eee1'];
      cv=document.createElement('canvas');cv.setAttribute('aria-hidden','true');cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:90';
      cv.width=innerWidth*dpr();cv.height=innerHeight*dpr();document.body.appendChild(cv);cx=cv.getContext('2d');
      var d=dpr(),W=cv.width;
      for(var i=0;i<130;i++){
        var side=i%2?0.15:0.85,a=(Math.random()*0.9+0.15)*Math.PI*(side<0.5?-0.55:-0.45)-Math.random()*0.3;
        var sp=(0.5+Math.random()*0.9)*d;
        parts.push({x:W*side,y:cv.height*0.78,vx:Math.cos(a)*sp*(side<0.5?1:-1)*(0.6+Math.random()),vy:-(0.8+Math.random()*0.9)*d*1.2,w:(5+Math.random()*6)*d,h:(8+Math.random()*8)*d,r:Math.random()*6,vr:(Math.random()-.5)*0.02,c:colors[i%colors.length]});
      }
      raf=requestAnimationFrame(loop);
    }catch(e){}
  }
  return{burst:burst,stop:stop};
})();
</script>

.radios button[aria-checked=true]{box-shadow:0 2px 0 rgba(0,0,0,.25),0 8px 18px rgba(46,139,87,.35)}
#menu .big.primary{background:linear-gradient(180deg,#3aa96b,#2a7f4f);box-shadow:0 3px 0 #1c5a38,0 12px 24px rgba(46,139,87,.35);font-size:20px;min-height:60px;transition:transform .08s,box-shadow .08s}
#menu .big.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #1c5a38;filter:none}
#menu .big:not(.primary){box-shadow:0 2px 0 rgba(0,0,0,.1)}
#topbar{box-shadow:0 3px 12px rgba(0,0,0,.10);position:relative;z-index:2}
#btnRow button{border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.14)}
#btnRow #bOk:not(:disabled){background:linear-gradient(180deg,#3aa96b,#2a7f4f);box-shadow:0 2px 0 #1c5a38}
#rackArea{box-shadow:0 -8px 18px rgba(0,0,0,.06);position:relative}
@media (prefers-reduced-motion:reduce){.logo i{animation:none}}
</style>

function botLater(ms,list){later(function(){show(pick(list||TAUNT),'บอท');},ms);}
function later(fn,ms){var t=setTimeout(fn,ms);timers.push(t);}
window.EM={
  init:function(c){o.send=c.send||null;o.bot=!!c.bot;},
  enable:function(v){on=!!v;var e=ui();e.btn.hidden=!on;if(!on){e.tray.hidden=true;}else place();},
  show:show,
  /* รับสติกเกอร์ของคนอื่นจาก presence: peers = {peerId: presence} */
  onPeers:function(peers,meId,nameFn){
    for(var id in peers){
      if(id===meId)continue;var em=peers[id]&&peers[id].em,ok=em&&typeof em.i==='number'&&em.i>=0&&em.i<16&&typeof em.n==='number';
      if(!(id in seen)){seen[id]=ok?em.n:0;continue;}
      if(!ok||seen[id]===em.n)continue;
      seen[id]=em.n;show(em.i,nameFn?nameFn(id):'',false);
    }
  },
  reset:function(){seen={};},
  /* บอท: ส่งสติกเกอร์กวนๆ แบบสุ่ม — p = โอกาส (0–1), kind = 'taunt'|'sad'|'wow' */
  botMaybe:function(p,kind){
    if(!on||Math.random()>=p)return;
    botLater(500+Math.random()*900,kind==='sad'?SAD:kind==='wow'?WOW:TAUNT);
  },
  TAUNT:TAUNT,SAD:SAD,WOW:WOW
};
})();
</script>

/*==CORE-START==*/
// ชั้นตรรกะ: ห้ามแตะ DOM/window/document ทั้งหมดเป็นฟังก์ชันที่ทดสอบใน Node ได้
const AMathCore = (function () {
  'use strict';
  const C = CONFIG;
  const nowFn = (typeof performance !== 'undefined' && performance.now) ? function () { return performance.now(); } : function () { return Date.now(); };

  // ---------- RNG (mulberry32 เก็บ state ได้) ----------
  function mulberry32(seed) {
    let a = seed >>> 0;
    const f = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.getState = function () { return a; };
    return f;
  }
  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // ---------- สัญลักษณ์ ----------
  // kind: 1 = เลขหลักเดียว, 2 = เลข 10-20 (ตัวหมากเดียว), 3 = เครื่องหมายคำนวณ, 4 = '='
  const kindCache = Object.create(null);
  function kindOf(sym) {
    let k = kindCache[sym];
    if (k) return k;
    if (sym === '=') k = 4;
    else if (sym === '+' || sym === '-' || sym === '*' || sym === '/') k = 3;
    else if (/^\d$/.test(sym)) k = 1;
    else if (/^\d\d$/.test(sym)) k = 2;
    else return 0;
    kindCache[sym] = k;
    return k;
  }
  // ค่าที่เลือกได้ของแต่ละหน้าตัวหมาก
  function faceChoices(face, cfg) {
    cfg = cfg || C;
    if (face === '+-') return ['+', '-'];
    if (face === '*/') return ['*', '/'];
    if (face === '?') return cfg.blankChoices.slice();
    return cfg.tiles[face] ? [face] : null;
  }
  function facePts(face, cfg) { return (cfg || C).tiles[face].pts; }
  function needsChoice(face) { return face === '+-' || face === '*/' || face === '?'; }

  // ---------- ถุง / กระดาน ----------
  function buildBag(cfg, rng) {
    cfg = cfg || C;
    const bag = [];
    let id = 0;
    for (const face of Object.keys(cfg.tiles)) {
      for (let i = 0; i < cfg.tiles[face].count; i++) bag.push({ id: id++, face: face });
    }
    return shuffle(bag, rng);
  }
  const premCache = new WeakMap();
  // สร้างแผนที่ช่องพิเศษ (สะท้อนควอดแรนท์) -> array ความยาว n*n เป็น '' หรือชื่อช่อง
  function buildPremium(cfg) {
    cfg = cfg || C;
    const n = cfg.boardSize, last = n - 1;
    const g = new Array(n * n).fill('');
    for (const k of Object.keys(cfg.premiumQuadrant)) {
      for (const rc of cfg.premiumQuadrant[k]) {
        const r = rc[0], c = rc[1];
        const cells = [[r, c], [r, last - c], [last - r, c], [last - r, last - c]];
        for (const q of cells) {
          const i = q[0] * n + q[1];
          if (g[i] && g[i] !== k) throw new Error('ช่องพิเศษซ้อนกัน ' + i);
          g[i] = k;
        }
      }
    }
    return g;
  }
  function getPremium(cfg) {
    cfg = cfg || C;
    let p = premCache.get(cfg);
    if (!p) { p = buildPremium(cfg); premCache.set(cfg, p); }
    return p;
  }
  // ตรวจ CONFIG ตอนโหลด (assert)
  function assertConfig(cfg) {
    cfg = cfg || C;
    let sum = 0;
    for (const f of Object.keys(cfg.tiles)) sum += cfg.tiles[f].count;
    if (sum !== 100) throw new Error('CONFIG.tiles รวมต้องเป็น 100 แต่ได้ ' + sum);
    const n = cfg.boardSize, g = getPremium(cfg);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const v = g[r * n + c];
      if (g[r * n + (n - 1 - c)] !== v || g[(n - 1 - r) * n + c] !== v || g[c * n + r] !== v) throw new Error('ช่องพิเศษไม่สมมาตรที่ ' + r + ',' + c);
    }
    if (g[cfg.center[0] * n + cfg.center[1]] !== '') throw new Error('ช่องกลางต้องไม่มีโบนัส');
    return true;
  }
  assertConfig(C);

  // ---------- ตัวตรวจสมการ ----------
  let lastErr = '';
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; }
  function frac(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; }
  // คำนวณหนึ่งด้านแบบจำนวนเต็มเคร่ง -> ตัวเลข หรือ NaN (ตั้ง lastErr)
  function evalSideStrict(nums, ops, cfg) {
    const neg = cfg.allowNegative;
    let acc = 0, sgn = 1, term = nums[0];
    for (let i = 0; i < ops.length; i++) {
      const op = ops[i], rhs = nums[i + 1];
      if (op === '*') {
        term = term * rhs;
        if (!Number.isSafeInteger(term)) { lastErr = 'E_TOOBIG'; return NaN; }
      } else if (op === '/') {
        if (rhs === 0) { lastErr = 'E_DIV0'; return NaN; }
        if (term % rhs !== 0) { lastErr = 'E_NOT_INT'; return NaN; }
        term = term / rhs;
      } else {
        acc += sgn * term;
        if (!Number.isSafeInteger(acc)) { lastErr = 'E_TOOBIG'; return NaN; }
        if (!neg && acc < 0) { lastErr = 'E_NEG'; return NaN; }
        sgn = op === '+' ? 1 : -1;
        term = rhs;
      }
    }
    acc += sgn * term;
    if (!Number.isSafeInteger(acc)) { lastErr = 'E_TOOBIG'; return NaN; }
    if (!neg && acc < 0) { lastErr = 'E_NEG'; return NaN; }
    return acc;
  }
  // แบบเศษส่วน (divisionMode = 'rational') -> สตริง "n" หรือ "n/d" หรือ null
  function evalSideRational(nums, ops, cfg) {
    const neg = cfg.allowNegative;
    const ok = function (x) { return Number.isSafeInteger(x[0]) && Number.isSafeInteger(x[1]); };
    let acc = [0, 1], sgn = 1, term = [nums[0], 1];
    const add = function (a, b) { return frac(a[0] * b[1] + b[0] * a[1], a[1] * b[1]); };
    for (let i = 0; i < ops.length; i++) {
      const op = ops[i], rhs = nums[i + 1];
      if (op === '*') { term = frac(term[0] * rhs, term[1]); if (!ok(term)) { lastErr = 'E_TOOBIG'; return null; } }
      else if (op === '/') {
        if (rhs === 0) { lastErr = 'E_DIV0'; return null; }
        term = frac(term[0], term[1] * rhs); if (!ok(term)) { lastErr = 'E_TOOBIG'; return null; }
      } else {
        acc = add(acc, [sgn * term[0], term[1]]);
        if (!ok(acc)) { lastErr = 'E_TOOBIG'; return null; }
        if (!neg && acc[0] < 0) { lastErr = 'E_NEG'; return null; }
        sgn = op === '+' ? 1 : -1; term = [rhs, 1];
      }
    }
    acc = add(acc, [sgn * term[0], term[1]]);
    if (!ok(acc)) { lastErr = 'E_TOOBIG'; return null; }
    if (!neg && acc[0] < 0) { lastErr = 'E_NEG'; return null; }
    return acc[1] === 1 ? String(acc[0]) : acc[0] + '/' + acc[1];
  }

  // ตรวจสมการจากอาร์เรย์สัญลักษณ์ (len ไม่บังคับ) -> {ok, values} | {ok:false, err, detail}
  function checkEquation(syms, cfg, len) {
    cfg = cfg || C;
    const n = len === undefined ? syms.length : len;
    const T = [], V = [];
    let i = 0;
    // 1) รวมเลขหลักเดียวที่ติดกันเป็นเลขหลายหลัก + ตรวจเลข 10-20 / ศูนย์นำ / ใหญ่เกิน
    while (i < n) {
      const k = kindOf(syms[i]);
      if (k === 1 || k === 2) {
        let j = i, hasBig = false;
        while (j < n) {
          const kj = kindOf(syms[j]);
          if (kj !== 1 && kj !== 2) break;
          if (kj === 2) hasBig = true;
          j++;
        }
        const g = j - i;
        if (g > 1) {
          if (hasBig && !cfg.allowBigTileConcat) return { ok: false, err: 'E_BIG_ADJ' };
          if (syms[i] === '0') return { ok: false, err: 'E_LEADING_ZERO' };
        }
        let v;
        if (g === 1) v = Number(syms[i]);
        else { let s = ''; for (let q = i; q < j; q++) s += syms[q]; v = Number(s); }
        if (!Number.isSafeInteger(v) || v > cfg.maxSafeValue) return { ok: false, err: 'E_TOOBIG' };
        T.push(1); V.push(v); i = j;
      } else if (k === 3 || k === 4) { T.push(k); V.push(syms[i]); i++; }
      else return { ok: false, err: 'E_SYNTAX', detail: { bad: syms[i] } };
    }
    // 2) ต้องมี =
    let eq = 0;
    for (let q = 0; q < T.length; q++) if (T[q] === 4) eq++;
    if (!eq) return { ok: false, err: 'E_NO_EQ' };
    // 3) ไวยากรณ์: num (op num)* คั่นด้วย =
    let expectNum = true;
    for (let q = 0; q < T.length; q++) {
      if (expectNum) { if (T[q] !== 1) return { ok: false, err: 'E_SYNTAX' }; expectNum = false; }
      else { if (T[q] === 1) return { ok: false, err: 'E_SYNTAX' }; expectNum = true; }
    }
    if (expectNum) return { ok: false, err: 'E_SYNTAX' };
    // 4) คำนวณแต่ละด้าน
    const rational = cfg.divisionMode === 'rational';
    const vals = [];
    let nums = [], ops = [];
    for (let q = 0; q <= T.length; q++) {
      if (q === T.length || T[q] === 4) {
        let v;
        if (rational) { v = evalSideRational(nums, ops, cfg); if (v === null) return { ok: false, err: lastErr }; }
        else { v = evalSideStrict(nums, ops, cfg); if (v !== v) return { ok: false, err: lastErr }; }
        vals.push(v); nums = []; ops = [];
      } else if (T[q] === 1) nums.push(V[q]);
      else ops.push(V[q]);
    }
    for (let q = 1; q < vals.length; q++) {
      if (vals[q] !== vals[0]) return { ok: false, err: 'E_NOT_EQUAL', detail: { values: vals } };
    }
    return { ok: true, values: vals };
  }

  // ---------- การวางและการนับคะแนน ----------
  // ดึง run (ดัชนีช่องต่อเนื่องที่ไม่ว่าง) ที่ผ่านช่อง (r,c) ในทิศ dir (0=แนวนอน 1=แนวตั้ง)
  function runOf(board, n, r, c, dir) {
    const cells = [];
    if (dir === 0) {
      let c0 = c; while (c0 > 0 && board[r * n + c0 - 1]) c0--;
      let c1 = c; while (c1 < n - 1 && board[r * n + c1 + 1]) c1++;
      for (let k = c0; k <= c1; k++) cells.push(r * n + k);
    } else {
      let r0 = r; while (r0 > 0 && board[(r0 - 1) * n + c]) r0--;
      let r1 = r; while (r1 < n - 1 && board[(r1 + 1) * n + c]) r1++;
      for (let k = r0; k <= r1; k++) cells.push(k * n + c);
    }
    return cells;
  }
  // คะแนน run: cells = ดัชนี, isNew(idx) บอกว่าตัวใหม่หรือไม่
  function scoreCells(board, premium, cells, isNew, cfg) {
    const info = cfg.premiumInfo;
    let base = 0, mult = 1;
    for (let k = 0; k < cells.length; k++) {
      const idx = cells[k];
      let pts = board[idx].pts;
      if (isNew(idx)) {
        const pr = premium[idx];
        if (pr) {
          const pi = info[pr];
          if (pi.type === 'P') pts *= pi.mul; else mult *= pi.mul;
        }
      }
      base += pts;
    }
    return base * mult;
  }

  // ตรวจและนับคะแนนการวาง (ใช้ทั้ง UI สด / ยืนยัน / AI)  state.turn = ผู้เล่นที่วาง
  function validatePlacement(state, placements, cfg) {
    cfg = cfg || C;
    const n = cfg.boardSize, board = state.board;
    const fail = function (err, extra) {
      const o = { ok: false, err: err, runs: [], total: 0, bingo: false };
      if (extra) for (const k in extra) o[k] = extra[k];
      return o;
    };
    if (!placements || !placements.length) return fail('E_EMPTY');
    if (placements.length > cfg.rackSize) return fail('E_TOO_MANY');
    const rack = state.racks[state.turn];
    const seen = new Set(), newIdx = new Set();
    const tiles = [];
    for (const p of placements) {
      const t = rack.find(function (x) { return x.id === p.tileId; });
      if (!t || seen.has(p.tileId)) return fail('E_BAD_TILE');
      seen.add(p.tileId);
      const ch = faceChoices(t.face, cfg);
      if (!p.sym || !ch || ch.indexOf(p.sym) < 0) return fail('E_NO_SYM', { cells: [p.r * n + p.c] });
      tiles.push(t);
    }
    for (const p of placements) {
      if (!(p.r >= 0 && p.r < n && p.c >= 0 && p.c < n)) return fail('E_OOB');
      const idx = p.r * n + p.c;
      if (board[idx] || newIdx.has(idx)) return fail('E_OCCUPIED', { cells: [idx] });
      newIdx.add(idx);
    }
    const allIdx = Array.from(newIdx);
    const sameRow = placements.every(function (p) { return p.r === placements[0].r; });
    const sameCol = placements.every(function (p) { return p.c === placements[0].c; });
    if (!sameRow && !sameCol) return fail('E_NOT_LINE', { cells: allIdx });
    if (placements.length > 1) {
      // ต้องต่อเนื่อง: ช่องระหว่างตัวแรกกับตัวสุดท้ายห้ามว่างโล่ง
      let lo = 1e9, hi = -1;
      for (const p of placements) { const v = sameRow ? p.c : p.r; if (v < lo) lo = v; if (v > hi) hi = v; }
      for (let v = lo; v <= hi; v++) {
        const idx = sameRow ? placements[0].r * n + v : v * n + placements[0].c;
        if (!board[idx] && !newIdx.has(idx)) return fail('E_GAP', { cells: allIdx });
      }
    }
    const cidx = cfg.center[0] * n + cfg.center[1];
    if (state.firstMove && !newIdx.has(cidx)) return fail('E_NO_CENTER', { cells: allIdx });

    // วางชั่วคราว แล้วถอยกลับเสมอ
    const premium = getPremium(cfg);
    placements.forEach(function (p, k) {
      const t = tiles[k];
      board[p.r * n + p.c] = { sym: p.sym, face: t.face, pts: t.face === '?' ? 0 : cfg.tiles[t.face].pts, blank: t.face === '?' };
    });
    try {
      const runs = [];
      const keys = new Set();
      for (const p of placements) {
        for (let dir = 0; dir < 2; dir++) {
          const cells = runOf(board, n, p.r, p.c, dir);
          if (cells.length < 2) continue;
          const key = dir + ':' + cells[0];
          if (keys.has(key)) continue;
          keys.add(key);
          runs.push({ dir: dir, cellIdx: cells });
        }
      }
      if (!runs.length) return fail(state.firstMove ? 'E_NO_RUN' : 'E_NOT_CONNECTED', { cells: allIdx });
      if (!state.firstMove) {
        const anyOld = runs.some(function (rn) { return rn.cellIdx.some(function (i) { return !newIdx.has(i); }); });
        if (!anyOld) return fail('E_NOT_CONNECTED', { cells: allIdx });
      }
      // run หลัก: ตามแนวที่วาง (ตัวเดียว = แนวนอนถ้ามี ไม่งั้นแนวตั้ง)
      let mainDir;
      if (placements.length > 1) mainDir = sameRow ? 0 : 1;
      else mainDir = runs.some(function (rn) { return rn.dir === 0; }) ? 0 : 1;
      let bad = -1, badMain = false;
      const out = runs.map(function (rn, ri) {
        const syms = rn.cellIdx.map(function (i) { return board[i].sym; });
        const res = checkEquation(syms, cfg);
        const isMain = rn.dir === mainDir;
        if (!res.ok) {
          if (bad < 0 || (isMain && !badMain)) { bad = ri; badMain = isMain; }
        }
        return {
          dir: rn.dir, main: isMain, syms: syms, text: syms.join(''),
          cells: rn.cellIdx.map(function (i) { return { r: Math.floor(i / n), c: i % n, isNew: newIdx.has(i) }; }),
          ok: res.ok, err: res.ok ? null : res.err, detail: res.ok ? { values: res.values } : (res.detail || null), score: 0
        };
      });
      if (bad >= 0) {
        const b = out[bad];
        const r = fail(b.main ? b.err : 'E_CROSS', { runs: out, badRun: bad, detail: b.detail });
        if (!b.main) r.cause = b.err;
        return r;
      }
      let total = 0;
      const isNew = function (i) { return newIdx.has(i); };
      out.forEach(function (o, ri) {
        o.score = scoreCells(board, premium, runs[ri].cellIdx, isNew, cfg);
        total += o.score;
      });
      const bingo = placements.length === cfg.rackSize;
      if (bingo) total += cfg.bingoBonus;
      return { ok: true, err: null, runs: out, total: total, bingo: bingo, bingoBonus: bingo ? cfg.bingoBonus : 0 };
    } finally {
      for (const p of placements) board[p.r * n + p.c] = null;
    }
  }

  // ---------- สถานะเกม ----------
  function cloneState(s) {
    const o = {};
    for (const k in s) o[k] = s[k];
    o.board = s.board.slice();
    o.bag = s.bag.slice();
    o.racks = s.racks.map(function (r) { return r.slice(); });
    o.scores = s.scores.slice();
    o.history = s.history.slice();
    return o;
  }
  function drawTiles(s, p, cfg) {
    while (s.racks[p].length < cfg.rackSize && s.bag.length) s.racks[p].push(s.bag.pop());
  }
  // ผู้เล่น 0 = มนุษย์, 1 = AI (ในเทสต์ AI-vs-AI ใช้ทั้งสองฝั่งได้)
  function createGame(opts, cfg) {
    cfg = cfg || C; opts = opts || {};
    const seed = (opts.seed === undefined ? Math.floor(Math.random() * 4294967296) : opts.seed) >>> 0;
    const rng = mulberry32(seed);
    const bag = buildBag(cfg, rng);
    const s = {
      board: new Array(cfg.boardSize * cfg.boardSize).fill(null), bag: bag, racks: [[], []], scores: [0, 0],
      turn: 0, scoreless: 0, history: [], firstMove: true, over: false, seed: seed, rng: 0, last: null, final: null,
      hint: newHint(opts.hints === undefined ? cfg.hint.perGame : opts.hints)
    };
    drawTiles(s, 0, cfg); drawTiles(s, 1, cfg);
    const fp = opts.firstPlayer || cfg.firstPlayer;
    s.turn = fp === 'human' ? 0 : fp === 'ai' ? 1 : (rng() < 0.5 ? 0 : 1);
    s.rng = rng.getState();
    return s;
  }
  // ---------- ตัวช่วย "ช่วยคิด" ----------
  // limit = จำนวนครั้งต่อเกม (-1 ไม่จำกัด, 0 ปิด), left = ที่เหลือ, used = ใช้ไปทั้งเกม, turn = ใช้ไปในตานี้ (ยังไม่ยืนยันตา)
  // วัตถุ hint ไม่ถูกแก้ในที่เดิม (สร้างใหม่ทุกครั้ง) เพราะ cloneState คัดลอกแบบตื้น
  function newHint(limit) { return { limit: limit, left: limit, used: 0, turn: 0 }; }
  function normHint(h, cfg) {
    cfg = cfg || C;
    const lim = h && Number.isInteger(h.limit) && h.limit >= -1 ? h.limit : cfg.hint.perGame;
    const left = h && Number.isInteger(h.left) && h.left >= -1 ? h.left : lim;
    return { limit: lim, left: lim === 0 ? 0 : left, used: h && h.used > 0 ? h.used | 0 : 0, turn: h && h.turn > 0 ? h.turn | 0 : 0 };
  }
  function hintAvailable(state) { const h = state && state.hint; return !!h && h.limit !== 0 && h.left !== 0; }
  // หักหนึ่งครั้ง (เรียกเมื่อได้ผลลัพธ์จริงเท่านั้น) -> true/false  (แก้ได้เฉพาะ state.hint)
  function spendHint(state) {
    if (!hintAvailable(state)) return false;
    const h = state.hint;
    state.hint = { limit: h.limit, left: h.left > 0 ? h.left - 1 : h.left, used: h.used + 1, turn: h.turn + 1 };
    return true;
  }
  // บันทึกจำนวนครั้งที่ใช้ในตานี้ลงประวัติเมื่อผู้เล่น (0) เดินจริง
  function settleHint(s, p, entry) {
    if (p !== 0 || !s.hint || !(s.hint.turn > 0)) return;
    entry.hinted = s.hint.turn;
    s.hint = { limit: s.hint.limit, left: s.hint.left, used: s.hint.used, turn: 0 };
  }
  function sumPts(rack, cfg) { let t = 0; for (const x of rack) t += cfg.tiles[x.face].pts; return t; }
  function finalizeScores(s, reason, cfg) {
    cfg = cfg || C;
    const pen = [sumPts(s.racks[0], cfg), sumPts(s.racks[1], cfg)];
    const bonus = [0, 0];
    let sc = s.scores.slice();
    if (cfg.endgame === 'scrabble') {
      for (let p = 0; p < 2; p++) sc[p] -= pen[p];
      if (reason === 'out') {
        for (let p = 0; p < 2; p++) if (s.racks[p].length === 0) { bonus[p] = pen[1 - p]; sc[p] += pen[1 - p]; }
      }
    }
    s.final = { reason: reason, pen: pen, bonus: bonus, scores: sc, winner: sc[0] > sc[1] ? 0 : sc[1] > sc[0] ? 1 : -1 };
    return s.final;
  }
  function afterAction(s, cfg) {
    let reason = null;
    if (s.bag.length === 0 && (s.racks[0].length === 0 || s.racks[1].length === 0)) reason = 'out';
    else if (s.scoreless >= cfg.maxScorelessTurns) reason = 'scoreless';
    if (reason) { s.over = true; finalizeScores(s, reason, cfg); }
    else s.turn = 1 - s.turn;
    return s;
  }
  function isGameOver(s) { return !!s.over; }

  function applyPlace(state, placements, cfg) {
    cfg = cfg || C;
    if (state.over) return { ok: false, err: 'E_OVER' };
    const v = validatePlacement(state, placements, cfg);
    if (!v.ok) return v;
    const n = cfg.boardSize, s = cloneState(state), p = s.turn;
    const used = new Set(), idxs = [];
    for (const pl of placements) {
      const t = s.racks[p].find(function (x) { return x.id === pl.tileId; });
      const idx = pl.r * n + pl.c;
      s.board[idx] = { sym: pl.sym, face: t.face, pts: t.face === '?' ? 0 : cfg.tiles[t.face].pts, blank: t.face === '?' };
      used.add(t.id); idxs.push(idx);
    }
    s.racks[p] = s.racks[p].filter(function (x) { return !used.has(x.id); });
    drawTiles(s, p, cfg);
    s.scores[p] += v.total;
    s.scoreless = 0; s.firstMove = false;
    s.last = { p: p, cells: idxs };
    s.history.push({ n: s.history.length + 1, p: p, type: 'place', texts: v.runs.map(function (r) { return r.text; }), score: v.total, bingo: v.bingo });
    settleHint(s, p, s.history[s.history.length - 1]);
    afterAction(s, cfg);
    return { ok: true, state: s, result: v };
  }
  function applyExchange(state, tileIds, cfg) {
    cfg = cfg || C;
    if (state.over) return { ok: false, err: 'E_OVER' };
    if (state.bag.length < cfg.minBagForExchange) return { ok: false, err: 'E_BAG_LOW' };
    const s = cloneState(state), p = s.turn;
    const ids = Array.from(new Set(tileIds || []));
    if (!ids.length || ids.length > s.racks[p].length) return { ok: false, err: 'E_BAD_TILE' };
    const give = s.racks[p].filter(function (x) { return ids.indexOf(x.id) >= 0; });
    if (give.length !== ids.length) return { ok: false, err: 'E_BAD_TILE' };
    const keep = s.racks[p].filter(function (x) { return ids.indexOf(x.id) < 0; });
    const drawn = [];
    for (let i = 0; i < give.length; i++) drawn.push(s.bag.pop());   // จั่วก่อนคืน
    for (const t of give) s.bag.push(t);
    const rng = mulberry32(s.rng);
    shuffle(s.bag, rng); s.rng = rng.getState();
    s.racks[p] = keep.concat(drawn);
    if (!s.firstMove) s.scoreless++;   // ยังไม่มีใครวางตัวแรก ไม่นับตาที่ไม่ได้คะแนน
    s.last = null;
    s.history.push({ n: s.history.length + 1, p: p, type: 'exchange', count: give.length, score: 0 });
    settleHint(s, p, s.history[s.history.length - 1]);
    afterAction(s, cfg);
    return { ok: true, state: s };
  }
  function applyPass(state, cfg) {
    cfg = cfg || C;
    if (state.over) return { ok: false, err: 'E_OVER' };
    const s = cloneState(state), p = s.turn;
    if (!s.firstMove) s.scoreless++;   // ยังไม่มีใครวางตัวแรก ไม่นับตาที่ไม่ได้คะแนน
    s.last = null;
    s.history.push({ n: s.history.length + 1, p: p, type: 'pass', score: 0 });
    settleHint(s, p, s.history[s.history.length - 1]);
    afterAction(s, cfg);
    return { ok: true, state: s };
  }

  // ยอมแพ้: ผู้เล่น p แพ้ทันที (ไม่หักตัวหมากเหลือ ใช้คะแนนที่ทำได้ตามจริง)
  function applyResign(state, p) {
    if (state.over) return { ok: false, err: 'E_OVER' };
    const s = cloneState(state);
    s.over = true; s.last = null;
    s.final = { reason: 'resign', pen: [0, 0], bonus: [0, 0], scores: s.scores.slice(), winner: 1 - p };
    return { ok: true, state: s };
  }

  // ---------- AI ----------
  // ค่าของตัวที่เหลือ (leave) สำหรับระดับยาก
  function leaveValue(faces, cfg) {
    cfg = cfg || C;
    const L = cfg.ai.leave;
    let v = 0, ops = 0, hasEq = false, allNum = faces.length > 0;
    const cnt = {};
    for (const f of faces) {
      cnt[f] = (cnt[f] || 0) + 1;
      if (f === '=') hasEq = true;
      if (f === '+' || f === '-' || f === '*' || f === '/' || f === '+-' || f === '*/') ops++;
      if (f === '=' || f === '?' || f === '+' || f === '-' || f === '*' || f === '/' || f === '+-' || f === '*/') allNum = false;
    }
    if (hasEq) v += L.eqBonus;
    v += Math.min(ops, L.opBonusMax) * L.opBonus;
    for (const f of Object.keys(cnt)) if (cnt[f] >= L.dupMin && kindOf(f) >= 1 && kindOf(f) <= 2) v -= L.dupPenalty;
    if (allNum) v -= L.allNumPenalty;
    return v;
  }

  // ตัวสร้างตาเดิน: generator ที่ yield ทุก yieldEvery โหนด และ return {candidates, nodes, timedOut, ms}

      const L = lines[dir][line];

    // memo ของ cross-run: key -> {ok, score}

    function crossInfo(idx, mainDir, fi, o) {

      const before = [], after = [];

        let nprev, neq = S_eq[d], ndgl = S_dgl[d], ndgz = S_dgz[d];
        if (k === 1) {

          else { ndgl = 1; ndgz = sym === '0' ? 1 : 0; }

          if (nnp === 1 && dir === 1) {

            for (let q = 0; q <= d; q++) if (S_new[q]) {

            for (let q = 0; q <= d; q++) symBuf[q] = S_sym[q];

          }
          if (go && !nconn) {

            if (j >= n) go = false;
            else {
              const cost = ec[j] - ec[nextPos] + (old[j] !== null ? 0 : 1);

            }
          }
          if (go && neq === 0) {

  // ค้นเพิ่มความลึกทีละขั้น (ระดับที่มี tiers) ใช้งบรวมเท่าเดิม; ระดับอื่นเรียก genMoves ตรงๆ
  // lvOverride (ไม่บังคับ) = ชุดงบแทนที่ของ cfg.ai.levels[levelKey] (ตัวช่วยใช้ cfg.hint.search)
  function* genMovesTiered(state, p, levelKey, seed, cfg, ctl, lvOverride) {
    cfg = cfg || C;
    const Lv = lvOverride ? Object.assign({}, cfg.ai.levels[levelKey], lvOverride) : cfg.ai.levels[levelKey];
    if (!Lv.tiers) return yield* genMoves(state, p, levelKey, seed, cfg, ctl, lvOverride);
    let nodesLeft = Lv.maxNodes, msLeft = Lv.timeLimit, prev = 0;
    const all = [];
    let tn = 0, tms = 0, timedOut = false;
    for (let i = 0; i < Lv.tiers.length; i++) {
      const T = Lv.tiers[i];
      const lim = { blank: Lv.blank, maxTiles: Math.min(T.maxTiles, Lv.maxTiles), minTiles: prev + 1, maxNodes: Math.max(1, Math.floor(nodesLeft * T.frac)), timeLimit: Math.max(1, msLeft * T.frac) };
      const r = yield* genMoves(state, p, levelKey, seed + i, cfg, ctl, lim);
      for (const c of r.candidates) all.push(c);
      nodesLeft -= r.nodes; msLeft -= r.ms; tn += r.nodes; tms += r.ms;
      prev = lim.maxTiles;
      timedOut = r.timedOut;           // สนใจว่าขั้นสุดท้ายหมดงบหรือไม่
      if (ctl && ctl.stop) { timedOut = true; break; }
      if (nodesLeft <= 0 || msLeft <= 0) { timedOut = true; break; }
    }
    return { candidates: all, nodes: tn, timedOut: timedOut, ms: tms };
  }
  // เลือกตาเดินตามระดับ
  function chooseMove(cands, levelKey, rng, rack, cfg) {
    cfg = cfg || C;
    if (!cands.length) return null;
    if (levelKey === 'easy') {
      const sorted = cands.slice().sort(function (a, b) { return a.score - b.score; });
      const med = sorted[Math.floor(sorted.length / 2)].score;
      const pool = sorted.filter(function (x) { return x.score <= med; });
      return pool[Math.floor(rng() * pool.length)];
    }
    if (levelKey === 'medium') {
      const top = cands.slice().sort(function (a, b) { return b.score - a.score; }).slice(0, cfg.ai.topN);
      let tw = 0; const w = top.map(function (x) { const v = Math.max(1, x.score); tw += v; return v; });
      let r = rng() * tw;
      for (let i = 0; i < top.length; i++) { r -= w[i]; if (r <= 0) return top[i]; }
      return top[0];
    }
    let best = null, bv = -1e9;
    for (const c of cands) {
      const usedSet = new Set(c.used);
      const left = rack.filter(function (t) { return !usedSet.has(t.id); }).map(function (t) { return t.face; });
      const v = c.score + leaveValue(left, cfg);
      if (v > bv) { bv = v; best = c; }
    }
    return best;
  }
  // เลือกตัวหมากที่จะแลก (ทิ้งเลขซ้ำ/คะแนนต่ำ เก็บ = ? และเครื่องหมายไว้)
  function pickExchange(rack, rng, cfg) {
    cfg = cfg || C;
    const E = cfg.ai.exchange;
    const seen = {};
    const arr = rack.map(function (t) {
      const k = kindOf(t.face);
      seen[t.face] = (seen[t.face] || 0) + 1;
      let keep;
      if (t.face === '?') keep = 100;
      else if (t.face === '=') keep = seen[t.face] === 1 ? 60 : 20;
      else if (k === 3 || t.face === '+-' || t.face === '*/') keep = seen[t.face] === 1 ? 40 : 15;
      else keep = 10 - 6 * (seen[t.face] > 1 ? 1 : 0) + cfg.tiles[t.face].pts * 0.1;
      return { id: t.id, keep: keep + rng() };
    });
    arr.sort(function (a, b) { return a.keep - b.keep; });
    const want = E.minCount + Math.floor(rng() * (E.maxCount - E.minCount + 1));
    const cntx = Math.max(1, Math.min(want, rack.length));
    return arr.slice(0, cntx).map(function (x) { return x.id; });
  }
  // ตาของ AI ทั้งตา (generator): return {type, ...}
  function* aiTurn(state, p, levelKey, seed, cfg, ctl) {
    cfg = cfg || C;
    const st = state.turn === p ? state : Object.assign({}, state, { turn: p });
    const res = yield* genMovesTiered(st, p, levelKey, seed, cfg, ctl);
    const rng = mulberry32((seed ^ 0x9E3779B9) >>> 0);
    const pick = chooseMove(res.candidates, levelKey, rng, st.racks[p], cfg);
    const stats = { nodes: res.nodes, ms: res.ms, cands: res.candidates.length, timedOut: res.timedOut };
    if (pick) {
      const v = validatePlacement(st, pick.placements, cfg);   // ตรวจซ้ำด้วยตัวตรวจเดียวกับผู้เล่น
      if (v.ok) return { type: 'place', placements: pick.placements, score: v.total, genScore: pick.score, texts: v.runs.map(function (r) { return r.text; }), stats: stats };
      if (typeof console !== 'undefined') console.error('AI สร้างตาเดินที่ไม่ผ่านการตรวจ', v.err, pick);
      stats.invalid = true;
    }

  }
  // ตัวช่วยเรียงสมการ: ค้นระดับสูงสุด (cfg.hint.search) จาก "มือของผู้เล่นที่ถึงตา" + กระดานเท่านั้น
  // สร้างสถานะย่อที่มีแค่ board/firstMove/มือของผู้ถาม จึงอ่านมืออีกฝ่ายหรือลำดับถุงไม่ได้ (ไม่แก้ state เดิม)
  // return {found, placements, score, texts, dir (0=นอน 1=ตั้ง), start:{r,c}, stats}
  function* hintSearch(state, seed, cfg, ctl) {
    cfg = cfg || C;
    const p = state.turn;
    const racks = [[], []]; racks[p] = state.racks[p].slice();
    const st = { board: state.board, racks: racks, bag: [], scores: [0, 0], turn: p, firstMove: state.firstMove, over: false, history: [] };
    const res = yield* genMovesTiered(st, p, 'hard', seed === undefined ? 1 : seed, cfg, ctl, cfg.hint.search);
    const stats = { nodes: res.nodes, ms: res.ms, cands: res.candidates.length, timedOut: res.timedOut };
    const sorted = res.candidates.slice().sort(function (a, b) { return b.score - a.score || b.placements.length - a.placements.length; });
    for (let i = 0; i < sorted.length && i < 20; i++) {
      const c = sorted[i];
      const v = validatePlacement(st, c.placements, cfg);     // ตรวจด้วยตัวตรวจเดียวกับตาปกติ
      if (!v.ok) { stats.invalid = (stats.invalid || 0) + 1; continue; }
      const main = v.runs.find(function (r) { return r.main; }) || v.runs[0];
      const dir = main.dir;
      let first = c.placements[0];
      for (const q of c.placements) if (dir === 0 ? (q.c < first.c) : (q.r < first.r)) first = q;
      return { found: true, placements: c.placements, score: v.total, texts: v.runs.map(function (r) { return r.text; }), dir: dir, start: { r: first.r, c: first.c }, stats: stats };
    }

  }
  // รัน generator จนจบแบบซิงโครนัส (ใช้ในเทสต์) onSlice(ms) เรียกทุกช่วงระหว่าง yield
  function runSync(gen, onSlice) {
    let t = nowFn();
    for (;;) {
      const r = gen.next();
      const t2 = nowFn();

  }
  // ใช้ผลของ AI กับสถานะเกม
  function applyAiDecision(state, dec, cfg) {
    if (dec.type === 'place') { const r = applyPlace(state, dec.placements, cfg); if (r.ok) return r; return applyPass(state, cfg); }
    if (dec.type === 'exchange') { const r = applyExchange(state, dec.ids, cfg); if (r.ok) return r; return applyPass(state, cfg); }
    return applyPass(state, cfg);

    howHtml:
      '<h4>เป้าหมาย</h4><p>วางตัวหมากบนกระดาน ' + CFG.boardSize + '×' + CFG.boardSize + ' ให้เป็น <b>สมการที่ถูกต้อง</b> เพื่อเก็บคะแนน ใครคะแนนสูงกว่าเมื่อจบเกมเป็นผู้ชนะ</p>' +
      '<h4>ตัวหมาก (รวม ' + TOTAL_TILES + ' ตัว)</h4><p>เลข 0-20, เครื่องหมาย + − × ÷, ตัวสองหน้า <code>+/−</code> และ <code>×/÷</code> (เลือกด้านตอนวาง), เครื่องหมาย <code>=</code> และตัวว่าง <code>?</code> (เลือกเป็นอะไรก็ได้ แต่ได้ 0 คะแนน) แต่ละคนถือ ' + CFG.rackSize + ' ตัว</p>' +

      '<h4>การวาง</h4><p>วางได้ 1-' + CFG.rackSize + ' ตัวในแถวเดียวหรือคอลัมน์เดียว ต่อเนื่องไม่เว้นช่อง ตาแรกต้องคลุมช่องกลาง ★ ตาต่อไปต้องต่อกับตัวเดิม ทุกแถว/คอลัมน์ที่เกิดใหม่ยาวตั้งแต่ 2 ตัวขึ้นไปต้องเป็นสมการถูกต้องทั้งหมด</p>' +
      '<h4>คะแนน</h4><p>คะแนน = ผลรวมคะแนนบนตัวหมาก (ไม่ใช่ค่าตัวเลข) ช่อง <b>T×2 / T×3</b> คูณเฉพาะตัวหมากที่เพิ่งวาง ช่อง <b>S×2 / S×3</b> คูณทั้งสมการ วางหมดมือ ' + CFG.rackSize + ' ตัวในตาเดียวได้โบนัส +' + CFG.bingoBonus + '</p>' +
      '<h4>แต่ละตา เลือกอย่างเดียว</h4><p>วางตัวหมาก, แลกตัวหมาก (เมื่อถุงเหลือ ' + CFG.minBagForExchange + ' ตัวขึ้นไป) หรือข้ามตา ถ้าข้าม/แลกติดกันรวม ' + CFG.maxScorelessTurns + ' ตา เกมจบ เกมจบเมื่อถุงหมดและมีคนหมดมือ ตัวหมากที่เหลือในมือถูกหักคะแนน ผู้หมดมือได้เพิ่มเท่ากับตัวที่เหลือของอีกฝ่าย</p>' +
      '<h4>วิธีใช้</h4><p>แตะตัวหมากในแร็ค แล้วแตะช่องว่างบนกระดานเพื่อวาง หรือกดค้างแล้วลากไปวาง แตะตัวหมากที่ยังไม่ยืนยันเพื่อยกคืนหรือเปลี่ยนค่า กระดานเล็กอยู่ในโหมดพอดีจอ แตะช่องเพื่อซูมเข้า ใช้สองนิ้วถ่างเพื่อซูม ลากนิ้วเดียวเพื่อเลื่อน แถบสถานะด้านล่างบอกผลสมการและคะแนนที่จะได้ก่อนกดยืนยัน</p>' +
      '<h4>ตัวช่วย "ช่วยคิด" 💡</h4><p>กดปุ่ม <b>💡 ช่วยคิด</b> (ตัวเลขในวงเล็บคือจำนวนครั้งที่เหลือ เริ่มต้น ' + CFG.hint.perGame + ' ครั้งต่อเกม เลือก "' + hintLabel(CFG.hint.choices[0]) + ' / ' + hintLabel(-1) + ' / ' + hintLabel(0) + '" ได้ที่เมนูตอนเริ่มเกม) แล้วเลือก <b>ใบ้</b> เพื่อดูช่องเริ่มต้นและทิศทางของสมการที่ดีที่สุด หรือ <b>ช่วยเรียงให้</b> เพื่อให้เกมวางตัวหมากครบทั้งสมการคะแนนสูงสุดเป็นตัวชั่วคราว คุณยืนยัน แก้ หรือล้างได้เหมือนวางเอง ตัวช่วยค้นด้วยระดับสูงสุดเสมอไม่ว่าเลือก AI ระดับไหน ใช้เวลาประมาณ ' + (CFG.hint.search.timeLimit / 1000) + ' วินาที หักจำนวนครั้งเฉพาะเมื่อได้ผลลัพธ์จริง ถ้ามือนี้ไม่มีสมการที่วางได้จะแจ้งให้แลกตัวหมากหรือข้ามตาโดยไม่หักจำนวนครั้ง จำนวนครั้งที่ใช้แสดงในหน้าจบเกมและประวัติ (ไม่หักคะแนน)</p>' +
      '<h4>เล่นกับเพื่อน 👥</h4><p>กด <b>สร้างห้อง</b> จะได้เลข 6 หลัก ส่งให้เพื่อนแล้วเพื่อนกด <b>ใส่เลขห้อง</b> เล่นกัน 2 คน (ไม่มี AI) สุ่มผู้เริ่ม เห็นตัวหมากเฉพาะของตัวเอง ต้องออนไลน์ทั้งสองคน (ถ้าเปิดผ่าน Claude ต้องล็อกอินด้วย) ไม่มีตัวช่วย "ช่วยคิด"</p><p><b>นาฬิกา ⏱</b> ฝ่ายละ ' + (CFG.online.clockMs / 60000) + ' นาที (รวม ' + (CFG.online.clockMs / 30000) + ' นาที) เวลาของคุณเดินเฉพาะตอนเป็นตาคุณ พอกดยืนยัน/แลก/ข้ามตา เวลาจะส่งไปให้อีกฝ่ายเดินต่อ เวลาหยุดเมื่อเพื่อนหลุดจากห้อง ถ้าเวลารวมของฝ่ายใดเกิน จะถูกหัก <b>นาทีละ ' + CFG.online.overPen + ' คะแนน</b> (นับเฉพาะนาทีเต็ม) ตอนจบเกม</p>' +
      '<h4>ตัวอย่าง</h4><p>ถูก: <code>1+2=3</code>, <code>2+3×4=14</code>, <code>1+2=3=1+2</code>, <code>8÷4÷2=1</code>, <code>10=10</code><br>ผิด: <code>2+3×4=20</code> (ไม่เท่ากัน), <code>7÷2=3</code> (หารไม่ลงตัว), <code>05=5</code> (ขึ้นต้น 0), <code>3−5=−2</code> (ติดลบนำหน้า), <code>1+2</code> (ไม่มี =)</p>'
  };
  // ข้อความข้อผิดพลาด (รหัส E_* -> ไทย)
  const ERR_TH = {
    E_NOT_EQUAL: 'ผลสองข้างไม่เท่ากัน', E_DIV0: 'ห้ามหารด้วย 0', E_NOT_INT: 'การหารต้องลงตัว', E_NEG: 'ค่าติดลบไม่ได้',
    E_TOOBIG: 'ตัวเลขใหญ่เกินไป', E_LEADING_ZERO: 'เลขหลายหลักห้ามขึ้นต้นด้วย 0', E_BIG_ADJ: 'เลข 10-20 ห้ามติดกับตัวเลขอื่น',
    E_SYNTAX: 'รูปสมการยังไม่ถูกต้อง', E_NO_EQ: 'ยังไม่มีเครื่องหมาย =', E_NOT_LINE: 'ตัวหมากต้องอยู่แถวเดียวหรือคอลัมน์เดียวกัน',
    E_GAP: 'ตัวหมากต้องต่อเนื่องกัน ไม่เว้นช่อง', E_NO_CENTER: 'ต้องคลุมช่องกลาง ★', E_NOT_CONNECTED: 'ต้องต่อกับตัวหมากเดิมบนกระดาน',
    E_NO_RUN: 'ต้องวางให้ติดกันตั้งแต่ 2 ตัวขึ้นไป', E_OCCUPIED: 'ช่องนี้มีตัวหมากแล้ว', E_NO_SYM: 'ยังไม่ได้เลือกค่าของตัวหมาก',
    E_BAD_TILE: 'ตัวหมากไม่ถูกต้อง', E_OOB: 'วางนอกกระดานไม่ได้', E_EMPTY: 'ยังไม่ได้วางตัวหมาก', E_TOO_MANY: 'วางได้ไม่เกิน ' + CFG.rackSize + ' ตัว',
    E_BAG_LOW: 'ถุงเหลือน้อยเกินไป', E_OVER: 'เกมจบแล้ว', E_BAD_ACT: 'คำสั่งไม่ถูกต้อง', E_NOT_TURN: 'ยังไม่ถึงตาของคุณ'
  };
  const WARN_ERR = { E_NO_EQ: 1, E_SYNTAX: 1, E_NO_RUN: 1, E_GAP: 1 };
  const DISP = { '*': '×', '/': '÷', '-': '−' };
  const disp = function (s) { return DISP[s] || s; };
  const dispRun = function (syms) { return syms.map(disp).join(''); };
  const dispText = function (t) { return t.replace(/[*\/-]/g, function (c) { return DISP[c]; }); };
  const esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  // ---------- เก็บข้อมูลในเบราว์เซอร์ (try/catch เสมอ) ----------
  const LS_SET = 'amath.settings.v1', LS_SAVE = 'amath.save.v1', LS_ROOM = 'amath.room.v1', LS_CODE = 'amath.lastcode.v1';
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ไม่เป็นไร */ } }

  // ---------- สถิติผู้เล่น (นับชนะ/แพ้บอท เก็บในเบราว์เซอร์นี้) ----------
  const LS_STATS = 'amath.stats.v1';
  const numOr0 = function (v) { return Number.isInteger(v) && v > 0 ? v : 0; };
  function loadStats() {
    const s = { wins: 0, losses: 0, draws: 0, byLevel: {} };
    ['easy', 'medium', 'hard'].forEach(function (k) { s.byLevel[k] = { wins: 0, losses: 0, draws: 0 }; });
    try {
      const o = JSON.parse(lsGet(LS_STATS) || 'null');
      if (o) {
        s.wins = numOr0(o.wins); s.losses = numOr0(o.losses); s.draws = numOr0(o.draws);
        ['easy', 'medium', 'hard'].forEach(function (k) {
          const b = o.byLevel && o.byLevel[k];
          if (b) s.byLevel[k] = { wins: numOr0(b.wins), losses: numOr0(b.losses), draws: numOr0(b.draws) };
        });
      }
    } catch (e) { /* ใช้ค่าเริ่มต้น */ }
    return s;
  }
  // บันทึกผลเกมนี้ครั้งเดียว (กันนับซ้ำด้วยธง state.statsDone)
  function recordResult() {
    if (!state || !state.over || !state.final || state.statsDone) return loadStats();
    state.statsDone = true;
    const s = loadStats(), w = state.final.winner;
    const key = w === 0 ? 'wins' : w === 1 ? 'losses' : 'draws';
    s[key]++;
    if (s.byLevel[level]) s.byLevel[level][key]++;
    lsSet(LS_STATS, JSON.stringify(s));
    return s;
  }
  let lastTaunt = -1;
  function pickTaunt() {
    const n = TXT.taunts.length;
    let i = Math.floor(Math.random() * n);
    if (n > 1 && i === lastTaunt) i = (i + 1 + Math.floor(Math.random() * (n - 1))) % n;
    lastTaunt = i;
    return TXT.taunts[i];
  }
  function statsMain(s) { return '🏆 ' + TXT.winStat + ' ' + s.wins + ' ' + TXT.timesWord + ' · ' + TXT.lossStat + ' ' + s.losses + ' ' + TXT.timesWord; }
  function statsDetail(s) {
    return ['easy', 'medium', 'hard'].map(function (k) { return TXT.levelNames[k] + ' ' + s.byLevel[k].wins + '/' + (s.byLevel[k].wins + s.byLevel[k].losses + s.byLevel[k].draws); }).join(' · ');
  }

  // ---------- สถานะ ----------
  let state = null, level = 'medium', firstChoice = 'random', hintChoice = CFG.hint.perGame;
  const ui = {
    pending: [], selId: null, selPend: null, mode: 'play', exSel: new Set(), thinking: false, rackOrder: [], msg: '',
    live: null, liveKind: '', aiToken: 0, cell: 24, tx: 0, ty: 0, wrapW: 0, wrapH: 0, press: null, drag: null, modals: [], fitMode: true, histOpen: false,
    hintBusy: false, hintToken: 0, hintMark: null, hintText: '', popIdx: null, sending: false
  };
  const wrap = $('boardWrap'), grid = $('grid');
  const cellEls = [], cellSig = new Array(N * N).fill(null);

  function toast(msg, top) {
    const t = $('toast'); t.textContent = msg; t.classList.toggle('top', !!top); t.classList.add('show');
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  const tileById = function (id) { return state.racks[0].find(function (t) { return t.id === id; }); };
  const pendAt = function (idx) { return ui.pending.find(function (p) { return p.r * N + p.c === idx; }); };
  const myTurn = function () { return !!state && !isSpec() && !state.over && state.turn === 0 && !ui.thinking && !ui.hintBusy && !ui.sending && !ui.modals.length && !(online && online.role === 'guest' && online.hostGone); };
  const premium = K.getPremium(CFG);
  function faceClass(face) {
    if (face === '+' || face === '-' || face === '+-') return 'plus';
    if (face === '*' || face === '/' || face === '*/') return 'mul';
    if (face === '=') return 'eqc';
    return '';
  }
  function faceLabel(face) { return face === '+-' ? '+/−' : face === '*/' ? '×/÷' : face === '?' ? '?' : disp(face); }

  // ---------- สร้างกระดาน ----------
  function buildGrid() {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < N * N; i++) {
      const el = document.createElement('div');
      const pr = premium[i];
      el.className = 'c' + (pr ? ' ' + pr : '') + (i === CFG.center[0] * N + CFG.center[1] ? ' ctr' : '');
      el.dataset.i = i;
      const pl = document.createElement('span'); pl.className = 'pl';
      if (pr) { const inf = CFG.premiumInfo[pr]; pl.innerHTML = '<i>' + (inf.type === 'E' ? 'S' : 'T') + '</i>×' + inf.mul; }
      else if (el.className.indexOf('ctr') >= 0) pl.textContent = '★';
      el.appendChild(pl);
      frag.appendChild(el); cellEls.push(el);
    }
    grid.appendChild(frag);
  }

  // ---------- มุมมอง (ซูม/เลื่อน) ----------
  const fitCell = function () { return Math.max(8, Math.min(ui.wrapW, ui.wrapH) / N); };
  const minCell = function () { return fitCell(); };
  const maxCell = function () { return Math.max(56, fitCell()); };
  function measure() { const r = wrap.getBoundingClientRect(); ui.wrapW = r.width; ui.wrapH = r.height; }
  function clampView() {
    const size = N * ui.cell, m = 10, mr = 64;   // ขอบขวาเผื่อพ้นปุ่มซูม
    ui.cell = Math.min(maxCell(), Math.max(minCell(), ui.cell));
    const s2 = N * ui.cell;
    ui.tx = s2 + m + mr <= ui.wrapW ? (ui.wrapW - s2) / 2 : Math.min(m, Math.max(ui.wrapW - s2 - mr, ui.tx));
    ui.ty = s2 + 2 * m <= ui.wrapH ? (ui.wrapH - s2) / 2 : Math.min(m, Math.max(ui.wrapH - s2 - m, ui.ty));
    return size;
  }
  function applyView(anim) {
    clampView();
    grid.classList.toggle('anim', !!anim);
    grid.style.transform = 'translate(' + ui.tx + 'px,' + ui.ty + 'px) scale(' + (ui.cell / BASE) + ')';
    grid.classList.toggle('fit', ui.cell < 30);
    positionTileBar();
  }
  // ซูมให้ช่องมีขนาด cell โดยตรึงจุด (ax, ay) ในพิกัด wrap
  function zoomAt(cell, ax, ay, anim) {
    const k0 = ui.cell, wx = (ax - ui.tx) / k0, wy = (ay - ui.ty) / k0;
    ui.cell = Math.min(maxCell(), Math.max(minCell(), cell));
    ui.tx = ax - wx * ui.cell; ui.ty = ay - wy * ui.cell;
    applyView(anim);
  }
  function focusOn(r, c, cell, anim) {
    if (cell) ui.cell = Math.min(maxCell(), Math.max(minCell(), cell));
    ui.tx = ui.wrapW / 2 - (c + 0.5) * ui.cell; ui.ty = ui.wrapH / 2 - (r + 0.5) * ui.cell;
    applyView(anim);
  }
  function fitView(anim) { measure(); ui.cell = fitCell(); ui.tx = 0; ui.ty = 0; applyView(anim); }
  function cellAtPoint(x, y) {
    const rc = wrap.getBoundingClientRect();
    const c = Math.floor((x - rc.left - ui.tx) / ui.cell), r = Math.floor((y - rc.top - ui.ty) / ui.cell);
    if (r < 0 || c < 0 || r >= N || c >= N) return null;
    return { r: r, c: c };
  }
  // เลื่อนมาที่ตัวหมากที่ AI เพิ่งวาง
  function focusCells(idxs) {
    if (!idxs || !idxs.length) return;
    let r0 = 99, r1 = -1, c0 = 99, c1 = -1;
    idxs.forEach(function (i) { const r = Math.floor(i / N), c = i % N; r0 = Math.min(r0, r); r1 = Math.max(r1, r); c0 = Math.min(c0, c); c1 = Math.max(c1, c); });
    const cr = (r0 + r1) / 2, cc = (c0 + c1) / 2;
    if (ui.cell < 30) {
      const span = Math.max(r1 - r0, c1 - c0) + 3;
      const want = Math.min(44, Math.max(minCell(), Math.min(ui.wrapW, ui.wrapH) / span));
      focusOn(cr, cc, Math.max(want, 30), true);
    } else {
      const px = ui.tx + (cc + 0.5) * ui.cell, py = ui.ty + (cr + 0.5) * ui.cell;
      if (px < ui.wrapW * 0.2 || px > ui.wrapW * 0.8 || py < ui.wrapH * 0.2 || py > ui.wrapH * 0.8) focusOn(cr, cc, 0, true);
    }
  }

  // ---------- วาดกระดาน ----------
  function renderBoard() {
    const lastSet = (state.last && state.last.p === 1 && state.turn === 0) ? new Set(state.last.cells) : null;
    const badCells = new Set();
    if (ui.live && !ui.live.ok) {
      if (ui.live.runs && ui.live.badRun !== undefined) ui.live.runs[ui.live.badRun].cells.forEach(function (c) { badCells.add(c.r * N + c.c); });
      else if (ui.live.cells && ui.liveKind === 'bad') ui.live.cells.forEach(function (i) { badCells.add(i); });
    }
    const hm = ui.hintMark, hmIdx = hm ? hm.r * N + hm.c : -1;
    for (let i = 0; i < N * N; i++) {
      const b = state.board[i], p = pendAt(i);
      let sig = '';
      if (b) sig = 'c|' + b.sym + '|' + b.pts + '|' + (b.blank ? 1 : 0) + '|' + (b.face) + '|' + (lastSet && lastSet.has(i) ? 1 : 0);
      else if (p) { const f = tileById(p.tileId); sig = 'p|' + p.sym + '|' + (f ? f.face : '') + '|' + ui.liveKind; }
      sig += '|' + (badCells.has(i) ? 'B' : '') + (i === hmIdx ? 'H' + hm.dir : '') + (ui.popIdx && ui.popIdx.has(i) ? 'P' : '');
      if (cellSig[i] === sig) continue;
      cellSig[i] = sig;
      const el = cellEls[i];
      let t = el.querySelector('.t');
      el.classList.toggle('badc', badCells.has(i));
      el.classList.toggle('hintc', i === hmIdx);
      if (i === hmIdx) el.dataset.arrow = hm.dir === 0 ? '→' : '↓';
      if (!b && !p) { if (t) t.remove(); continue; }
      if (!t) { t = document.createElement('div'); el.appendChild(t); }
      const face = b ? b.face : (tileById(p.tileId) || {}).face;
      const blank = b ? b.blank : face === '?';
      const pts = b ? b.pts : (blank ? 0 : (CFG.tiles[face] || { pts: 0 }).pts);
      t.className = 't ' + faceClass(b ? b.sym : p.sym).replace('plus', 'plus') + (blank ? ' blank' : '') +
        (b ? (lastSet && lastSet.has(i) ? ' last' : '') : ' pend ' + (ui.liveKind || 'warn') + (ui.popIdx && ui.popIdx.has(i) ? ' pop' : ''));
      t.innerHTML = '<span>' + esc(disp(b ? b.sym : p.sym)) + '</span>' + (pts ? '<b class="pt">' + pts + '</b>' : '');
    }
  }

  // ---------- วาดแร็ค ----------
  function syncRackOrder() {
    const ids = state.racks[0].map(function (t) { return t.id; });
    const idSet = new Set(ids);
    let ord = ui.rackOrder.map(function (id) { return idSet.has(id) ? id : null; });
    while (ord.length < TILE_LIMIT) ord.push(null);
    ord = ord.slice(0, TILE_LIMIT);
    const have = new Set(ord.filter(function (x) { return x !== null; }));
    ids.forEach(function (id) { if (!have.has(id)) { const k = ord.indexOf(null); if (k >= 0) ord[k] = id; } });
    ui.rackOrder = ord;
  }
  function renderRack() {
    syncRackOrder();
    const rack = $('rack'); rack.innerHTML = '';
    if (isSpec()) { rack.classList.add('dim'); rack.innerHTML = '<div class="specnote">👁 กำลังรับชม — ดูได้อย่างเดียว</div>'; return; }
    rack.classList.toggle('dim', !myTurn() && !(ui.mode === 'exchange'));
    for (let i = 0; i < TILE_LIMIT; i++) {
      const slot = document.createElement('div'); slot.className = 'slot'; slot.dataset.i = i;
      const id = ui.rackOrder[i];
      const tile = id === null ? null : tileById(id);
      if (tile && !ui.pending.some(function (p) { return p.tileId === id; })) {
        const el = document.createElement('div');
        el.className = 'rt ' + faceClass(tile.face) + (tile.face === '+-' || tile.face === '*/' ? ' pair' : '') + (tile.face === '?' ? ' blank' : '') +
          (ui.selId === id ? ' sel' : '') + (ui.mode === 'exchange' && ui.exSel.has(id) ? ' exs' : '');
        el.dataset.id = id;
        const pts = CFG.tiles[tile.face].pts;
        el.innerHTML = '<span>' + esc(faceLabel(tile.face)) + '</span>' + (pts ? '<b class="pt">' + pts + '</b>' : '');
        slot.appendChild(el);
      } else slot.classList.add('empty');
      rack.appendChild(slot);
    }
  }

  // ---------- ปุ่มและแถบสถานะ ----------
  function evaluate() {
    ui.live = null; ui.liveKind = '';
    if (!state || state.over || state.turn !== 0 || !ui.pending.length) return;
    const v = K.evaluatePlacement(state, ui.pending);
    ui.live = v;
    ui.liveKind = v.ok ? 'ok' : (WARN_ERR[v.err] ? 'warn' : 'bad');
  }
  function errMessage(v) {
    if (v.err === 'E_CROSS') {
      const r = v.runs[v.badRun];
      return (r.dir === 0 ? 'แนวนอน ' : 'แนวตั้ง ') + esc(dispRun(r.syms)) + ' ไม่เป็นสมการ: ' + (ERR_TH[v.cause] || '');
    }
    let head = '';
    if (v.runs && v.runs.length && v.badRun !== undefined) head = esc(dispRun(v.runs[v.badRun].syms)) + ' ✗ ';
    let extra = '';
    if (v.err === 'E_NOT_EQUAL' && v.detail && v.detail.values) extra = ' (' + TXT.valuesLbl + ' ' + v.detail.values.join(', ') + ')';
    return head + (ERR_TH[v.err] || v.err) + extra;
  }
  function renderStatus() {
    const el = $('statusIn');
    let h;
    if (state.over) h = '<b>' + TXT.over + '</b>';
    else if (isSpec()) h = (ui.msg ? ui.msg + ' · ' : '') + '<span class="gray">' + (oppAbsent() ? 'ผู้เล่นหลุดจากห้อง รอกลับเข้ามา' : 'ตา ' + esc(state.turn === 0 ? specNm(1) : specNm(0))) + '</span>';
    else if (online && ui.sending) h = '<span class="spin"></span><b>' + TXT.sentWait + '</b>';
    else if (online && oppAbsent() && state.turn === 1) h = '<span class="bad">' + (online.role === 'host' ? TXT.waitFriendJoin + ' <b>' + online.code + '</b>' : TXT.hostGone) + '</span>';
    else if (ui.hintBusy) h = '<span class="spin"></span><b>' + ui.hintText + '</b>';
    else if (ui.thinking) h = '<span class="spin"></span><b>' + TXT.aiThinking + '</b> <span class="gray">(' + TXT.levelNames[level] + ')</span>';
    else if (state.turn !== 0) h = '<span class="gray">' + (online ? TXT.waitFriend : TXT.aiWait) + '</span>';
    else if (ui.mode === 'exchange') h = '<span class="gray">' + TXT.exModeHint + ' · ' + TXT.exSelected + ' ' + ui.exSel.size + ' ' + TXT.tilesUnit + '</span>';
