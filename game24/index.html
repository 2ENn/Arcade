<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>เกม 24</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Sarabun:wght@400;500;700&display=swap">
<style>
/* Layout: โต๊ะกระดานดำ — แถบบน / เป้าหมาย 24 / ไพ่ 4 ใบ / บันทึกขั้นตอน / ปุ่มเครื่องหมาย / เครื่องมือ; จอเตี้ยวางไพ่เรียงแถวเดียว */
:root{
  --bg:#13201e; --surface:#1c2d2a; --line:#2f4642; --ink:#eef2ea; --muted:#8fa7a1;
  --card:#f3eee1; --card-ink:#1a2320; --card-sel:#ffcf5a;
  --accent:#ffcf5a; --accent-ink:#2a2007; --op:#2a403c;
  --good:#7bd88f; --bad:#ff917c;
  --f-ui:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'Bricolage Grotesque','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:8px 16px 12px;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.ib{min-width:44px;height:40px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:500}
.hd{text-align:left;line-height:1.15}
.hd b{display:block;font-family:var(--f-num);font-size:18px;font-weight:800}
.hd span{color:var(--muted);font-variant-numeric:tabular-nums}
#sc{color:var(--muted);font-size:13px;text-align:right;line-height:1.3;min-width:64px;font-variant-numeric:tabular-nums}
#opp{display:flex;justify-content:center;gap:6px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums;padding:2px 0}
#opp .ri{flex:1 0 100%;text-align:center;color:var(--muted);font-size:12px}
#opp .oc{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px;max-width:130px}
#opp .oc b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#opp .oc span{font-family:var(--f-num);font-weight:800;background:var(--bg);border-radius:999px;min-width:24px;text-align:center;padding:0 6px}
#opp .oc.me{border-color:var(--accent)}#opp .oc.me b{color:var(--accent)}
#opp .oc.out{opacity:.45}
.rolechips{display:flex;gap:8px}
.rolechips button{flex:1;padding:8px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700}
.rolechips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plist .mut{color:var(--muted);font-size:13px}
.svc{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.svc h2 small{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.srow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.srow.win{outline:2px solid var(--accent)}.srow.out{opacity:.5}
.srow .sh{display:flex;justify-content:space-between;gap:8px}
.srow .sh em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.sbar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}.sbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.sbanner{text-align:center;font-weight:700;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--accent)}
.scards{display:flex;gap:8px;justify-content:center}
.scards b{min-width:46px;text-align:center;padding:10px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:22px}
#opp .oc.eye{flex:0 0 auto;min-width:0}
.plist{list-style:none;margin:8px 0 0;padding:0}
.plist li{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:10px;background:var(--bg);margin-top:6px}
.plist li.me{outline:2px solid var(--accent)}
.plist li em{font-style:normal;color:var(--muted);font-size:13px}
.lbl2{font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:700}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{padding:7px 12px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-weight:700;font-size:14px}
.mchip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
#target{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.08em}
#target b{display:block;font-family:var(--f-num);font-size:64px;line-height:1;color:var(--accent);font-weight:800;letter-spacing:0}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0;max-height:300px}
.card{position:relative;border-radius:16px;background:var(--card);color:var(--card-ink);font-family:var(--f-num);font-weight:800;
  font-size:clamp(38px,12vw,64px);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.35);min-height:76px;
  transition:transform .12s,box-shadow .12s}
.card small{position:absolute;left:10px;top:6px;font-size:11px;font-weight:600;color:#6c7a74;font-family:var(--f-ui)}
.card.sel{background:var(--card-sel);transform:translateY(-3px);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.card.fr{font-size:clamp(28px,8vw,44px)}
.card.hint{outline:4px solid var(--good)}
.card.new{animation:pop .25s ease}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
#log{min-height:22px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.op{height:58px;border-radius:14px;background:var(--op);font-family:var(--f-num);font-size:30px;font-weight:600}
.op.on{background:var(--accent);color:var(--accent-ink)}
#tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tb{height:46px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.tb:disabled{opacity:.35}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 22px;font-weight:700;font-size:16px}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.ov.dim{background:rgba(5,10,9,.72);justify-content:center}
.card2{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.ov.dim .card2{background:var(--surface);padding:22px;border-radius:16px;border:1px solid var(--line)}
h1{font-family:var(--f-num);font-size:44px;line-height:1.05;margin:8px 0 0;font-weight:800}
h1 em{font-style:normal;color:var(--accent)}
h2{font-family:var(--f-num);font-size:24px;margin:0;font-weight:800}
.sub{color:var(--muted);margin:0}
.lv{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);width:100%;margin-bottom:8px}
.lv b{font-size:17px}.lv small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.lv span{color:var(--muted);font-size:13px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:120px;text-align:center}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{padding:10px 4px;border-radius:12px;background:var(--bg)}
.stat b{display:block;font-family:var(--f-num);font-size:22px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--muted)}
.sol{font-family:var(--f-num);font-size:22px;text-align:center;color:var(--accent);padding:6px 0;word-break:break-word}
.code{font-family:var(--f-num);font-size:46px;letter-spacing:.14em;text-align:center;font-weight:800}
input.cin{font:inherit;font-family:var(--f-num);font-size:32px;letter-spacing:.2em;text-align:center;width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp .9s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;font-weight:500;max-width:90vw;text-align:center}
@media (orientation:landscape) and (max-height:520px){
  #app{padding-top:4px;padding-bottom:6px;gap:4px}
  main{flex-direction:row;flex-wrap:wrap;align-content:center;gap:8px}
  #target{flex:0 0 100px;align-self:center}#target b{font-size:48px}
  #cards{grid-template-columns:repeat(4,1fr);flex:1 1 360px;max-height:110px}
  #log{flex:1 1 100%;order:3;min-height:16px}
  #ops{flex:1 1 40%;order:4}#tools{flex:1 1 40%;order:5}
  .op{height:44px}.tb{height:40px}
}

/* ---- polish v2 ---- */
body{background:radial-gradient(120% 45% at 50% -8%,rgba(255,207,90,.16),transparent 62%),var(--bg);background-attachment:fixed}
.card{background:linear-gradient(180deg,#f8f4e8,#ece5d2);border:1px solid rgba(0,0,0,.12);box-shadow:0 4px 0 rgba(0,0,0,.4),0 12px 24px rgba(0,0,0,.25);overflow:hidden}
.card::after{content:attr(data-pip);position:absolute;right:10px;bottom:6px;font-size:14px;font-family:var(--f-ui);font-weight:700;color:#6c7a74;transform:rotate(180deg)}
.card small{font-size:15px;font-weight:700;color:#6c7a74;left:10px;top:6px}
.card.red small,.card.red::after{color:#c2412f}
.card.sel{background:linear-gradient(180deg,#ffe08a,#ffcf5a);box-shadow:0 7px 0 rgba(0,0,0,.4),0 16px 28px rgba(255,207,90,.25)}
.card:active{transform:translateY(2px)}
.card.new{animation:flip .38s cubic-bezier(.2,1.3,.4,1)}
@keyframes flip{0%{transform:rotateY(90deg) scale(.8)}100%{transform:rotateY(0) scale(1)}}
#cards.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#target b{text-shadow:0 0 28px rgba(255,207,90,.45)}
#target.ok b{animation:glow .9s ease 2}
@keyframes glow{50%{text-shadow:0 0 44px rgba(255,207,90,.95);transform:scale(1.12)}}
.op{box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,background .15s}
.op:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.op[data-op="+"]{color:#7bd88f}.op[data-op="×"]{color:#ffcf5a}.op[data-op="−"]{color:#ff917c}.op[data-op="÷"]{color:#8fd0ff}
.op.on{color:var(--accent-ink)!important}
.tb{box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn{box-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.hero{display:flex;align-items:center;gap:14px;margin-top:6px}
.hero svg{width:76px;height:76px;flex:none;border-radius:18px}
.hero h1{margin:0}
.lv{background:linear-gradient(180deg,var(--surface),#18282a);box-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .1s;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.lv:active{transform:translateY(2px)}
.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){.card.new,#cards.shake,#target.ok b{animation:none}}
@media (prefers-reduced-motion:reduce){.card,.card.new,.spin{animation:none;transition:none}}
</style>

/* ดอกไม้ไฟกระดาษ (เฉลิมฉลองตอนชนะ) */
window.Confetti=(function(){
  var cv,cx,parts=[],raf=0,t0=0;
  function loop(ts){
    if(!t0)t0=ts;var dt=Math.min(32,ts-(loop.l||ts));loop.l=ts;
    cx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(function(p){
      p.vy+=0.0016*dt*dpr();p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.995;p.r+=p.vr*dt;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,Math.min(1,(2600-(ts-t0))/700));
      cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
    });
    if(ts-t0<2600)raf=requestAnimationFrame(loop);else stop();
  }
  function dpr(){return window.devicePixelRatio||1;}
  function stop(){cancelAnimationFrame(raf);raf=0;if(cv&&cv.parentNode)cv.parentNode.removeChild(cv);cv=null;parts=[];t0=0;loop.l=0;}
  function burst(colors){
    try{
      if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      stop();colors=colors||['#ffcf5a','#2f9e6a','#2a9cc2','#ff917c','#f3eee1'];
      cv=document.createElement('canvas');cv.setAttribute('aria-hidden','true');cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:90';
      cv.width=innerWidth*dpr();cv.height=innerHeight*dpr();document.body.appendChild(cv);cx=cv.getContext('2d');
      var d=dpr(),W=cv.width;
      for(var i=0;i<130;i++){
        var side=i%2?0.15:0.85,a=(Math.random()*0.9+0.15)*Math.PI*(side<0.5?-0.55:-0.45)-Math.random()*0.3;
        var sp=(0.5+Math.random()*0.9)*d;
        parts.push({x:W*side,y:cv.height*0.78,vx:Math.cos(a)*sp*(side<0.5?1:-1)*(0.6+Math.random()),vy:-(0.8+Math.random()*0.9)*d*1.2,w:(5+Math.random()*6)*d,h:(8+Math.random()*8)*d,r:Math.random()*6,vr:(Math.random()-.5)*0.02,c:colors[i%colors.length]});
      }
      raf=requestAnimationFrame(loop);
    }catch(e){}
  }
  return{burst:burst,stop:stop};
})();
</script>

  function buildPools(){

function rosterHost(me){
  const lobby=me.st===0;let ch=false;
  const here=p=>p===me.meId||!!me.peers[p];
  if(lobby){const k=me.pl.filter(here);if(k.length!==me.pl.length){me.pl=k;ch=true;}}
  const k2=me.sp.filter(here);if(k2.length!==me.sp.length){me.sp=k2;ch=true;}
  Object.keys(me.peers).forEach(p=>{
    const pr=me.peers[p];
    if(p===me.meId||pr.role!=='guest'||pr.code!==me.code||me.pl.indexOf(p)>=0||me.sp.indexOf(p)>=0)return;
    if(pr.want==='s'){if(me.sp.length<MAXSP){me.sp.push(p);ch=true;}}
    else if(lobby&&me.pl.length<me.max){me.pl.push(p);ch=true;}
  });

}

function mpPeers(me,ch){

function hostOpen(level){

function hostNewMatch(){

function hostNextRound(){

  setTimeout(()=>{

function hostPublish(){

function hostDecide(idx){ /* idx = ตำแหน่งผู้เล่นใน pl ที่ตอบถูกก่อน */
  const me=on;if(!me||me.decided||me.over)return;
  me.decided=true;me.winner=idx;me.sc[idx]=(me.sc[idx]||0)+1;
  lockRound();hostPublish();roundBanner(idx);
  const top=Math.max.apply(null,me.sc);

    setTimeout(()=>{if(on===me&&!me.over){const w=standings()[0];matchEndHost(w.me?'ถึง '+TARGET+' แต้มก่อน':nameOf(me,w.p)+' ถึง '+TARGET+' แต้มก่อน');}},1200);return;

/* --- คนดู: เห็นไพ่รอบนี้ + แต้มของทุกคน --- */

function g24SpecRender(me){

    rows.map((r,i)=>'<div class="srow'+(over&&i===0?' win':'')+(r.out?' out':'')+'"><div class="sh"><b>'+esc(r.n)+'</b><em>'+(r.out?'ออกแล้ว · ':'')+r.s+'/'+TARGET+' แต้ม</em></div><div class="sbar"><i style="width:'+Math.min(100,Math.round(r.s/TARGET*100))+'%"></i></div></div>').join('');

function guestGame(me){
  const h=me.peers[me.hostPeer];
  if(!h||!inRoom(me)||!h.nums)return;
  if(isSp(me)){
    if(me.st===1&&h.key&&h.key!==me.key){clearTimeout(me.joinTimer);me.key=h.key;me.rd=h.rd;me.level=h.lv;me.started=true;me.over=false;me.hostGone=false;g24SpecStart(me);}
    me.nums=h.nums;me.sc=h.sc||[];me.rd=h.rd;
    if(me.started)g24SpecRender(me);
    return;
  }
  if(me.st===1&&h.key&&h.key!==me.key&&!h.fin){
    const nums=h.nums.split(',').map(Number);
    clearTimeout(me.joinTimer);closeModal();
    me.key=h.key;me.rd=h.rd;me.started=true;me.over=false;me.decided=false;
    newRound(h.lv,nums,true);G.matchOver=false;

  }

  me.sc=h.sc||[];scoreUI();
  if(h.w>=0&&h.key===me.key){
    if(!G.locked)lockRound();
    if(me.announced!==h.key){me.announced=h.key;roundBanner(h.w);}
  }
  if(h.fin&&h.key===me.key&&!me.over)matchEnd('จบการแข่งขัน');
}
const MPH={
  start:hostNewMatch,

  if(on.role==='host')hostScan(on);
  else if(isOut(on,on.hostPeer)){on.sc=on.sc||[];matchEnd('เจ้าของห้องออกจากห้อง',true);}
  scoreUI();
},1000);

showMenu();initRoom();
})();

  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('#gnav a[href],#gmenu a[href],.gm-embed a[href]'),o=e.target.closest&&e.target.closest('#gOut');
    if(!a&&!o)return;if(a&&(e.ctrlKey||e.metaKey||e.shiftKey||a.target==='_blank'))return;
    var g=guard();if(!g)return;
    e.preventDefault();e.stopImmediatePropagation();
    ask(g,function(){if(a)location.href=a.href;else if(window.Arcade)Arcade.logout();});
  },true);
  addEventListener('beforeunload',function(e){var g=guard();if(g&&!g.soft){e.preventDefault();e.returnValue='';}});
  var el=document.getElementById('gwho');if(!el||!window.Arcade)return;
  var f=document.createElement('link');f.rel='stylesheet';f.href='https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Sarabun:wght@400;700&display=swap';document.head.appendChild(f);
  var cur=(nv&&nv.getAttribute('data-game'))||'';
  var GM=[['game24','เกม 24','#ffcf5a'],['sudoku','Sudoku','#2a9cc2'],['amath','A-Math','#2f9e6a'],['checkers','หมากฮอส','#3f9a7c'],['chess','หมากรุก','#c89b6a']];
  var LV={easy:'ง่าย',medium:'กลาง',hard:'ยาก',expert:'โหด',online:'แข่งกับเพื่อน'},AIL={easy:'สู้ AI ง่าย',medium:'สู้ AI กลาง',hard:'สู้ AI ยาก',online:'แข่งกับเพื่อน'};
  var AI={chess:1,checkers:1,amath:1},STAT={amath:'score',sudoku:'time',game24:'time'},ORDER=['easy','medium','hard','expert','online'];
  function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fmtT(t){t=+t;if(t>=60){var m=Math.floor(t/60),s=Math.round(t-m*60);if(s===60){m++;s=0;}return m+':'+(s<10?'0':'')+s+' น.';}return t.toFixed(1)+' วิ';}
  var gg='';GM.forEach(function(g){gg+='<a href="../'+g[0]+'/" style="--c:'+g[2]+'"'+(g[0]===cur?' aria-current="page"':'')+'><img src="../icons/'+g[0]+'.png" alt="">'+g[1]+'</a>';});
  var BODY='<div class="gm-who gmWho"></div><div class="gmStats"></div><div class="gm-card"><div class="gm-h">เล่นเกมอื่น</div><div class="gm-games">'+gg+'</div></div><div class="gm-links"><a class="pri" href="../">หน้าแรก</a><a href="../#ranking">ตารางอันดับ</a><a href="../profile/">โปรไฟล์ของฉัน</a></div>';
  var box=document.createElement('div');box.id='gmenu';box.hidden=true;
  box.innerHTML='<div class="gm-box" role="dialog" aria-modal="true" aria-label="เมนู"><div class="gm-top"><span class="gm-h" style="margin:0">เมนู</span><button type="button" class="gm-x" id="gmX" aria-label="ปิดเมนู">✕</button></div>'+BODY+'</div>';
  document.body.appendChild(box);
  var opener=null;
  function closeM(){box.hidden=true;if(opener&&opener.focus)try{opener.focus();}catch(e){}}
  function openM(){opener=document.activeElement;box.hidden=false;paint(box);box.querySelector('#gmX').focus();}
  window.__gmenuOpen=openM;
  box.querySelector('#gmX').onclick=closeM;
  box.addEventListener('mousedown',function(e){if(e.target===box)closeM();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!box.hidden&&!document.getElementById('gleave'))closeM();});
  el.addEventListener('click',function(e){if(e.target.closest('#gmBtn'))openM();});
  var tok=0,U=null;
  function paint(root){
    var who=root.querySelector('.gmWho'),st=root.querySelector('.gmStats'),my=++tok;
    if(!U){
      who.innerHTML='ยังไม่ได้เข้าสู่ระบบ<small>เล่นได้ แต่ผลจะไม่ติดอันดับ</small>';
      st.innerHTML='<div class="gm-card"><div class="gm-h">สถิติของฉัน</div><p class="gm-note" style="margin:0 0 10px">เข้าสู่ระบบเพื่อเก็บสถิติและติดอันดับ</p><div class="gm-links"><a class="pri" href="../#login">เข้าสู่ระบบ</a></div></div>';
      return;
    }
    who.innerHTML='สวัสดี <a href="../profile/">'+esc(U.username)+'</a><small>แตะชื่อเพื่อดูสถิติทั้งหมด</small>';
    st.innerHTML='<div class="gm-card"><div class="gm-h">สถิติของฉัน</div><p class="gm-note" style="margin:0">กำลังโหลด…</p></div>';
    Promise.all([Arcade.userRows(U.username),Arcade.overall()]).then(function(r){
      if(my!==tok||!U)return;
      var rows=r[0],ov=r[1].filter(function(x){return x.plays>0;}).sort(function(a,b){return b.points-a.points||b.wins-a.wins||(a.username<b.username?-1:1);});
      var i=ov.findIndex(function(x){return x.username===U.username;}),me=ov[i]||{points:0,wins:0,plays:0};
      var line='อันดับรวม '+(i>=0?'#'+(i+1):'–')+' · '+(me.points||0)+' แต้ม';
      var gname='';GM.forEach(function(g){if(g[0]===cur)gname=g[1];});
      var h;
      if(gname){
        var rs=rows.filter(function(x){return x.game===cur&&x.plays>0;}),w=0,p=0;rs.forEach(function(x){w+=x.wins;p+=x.plays;});
        h='<div class="gm-card"><div class="gm-h">สถิติของฉัน: '+esc(gname)+'</div>';
        if(!p)h+='<p class="gm-note" style="margin:0">ยังไม่เคยเล่นเกมนี้ ลองเล่นรอบแรกได้เลย</p>';
        else{
          h+='<div class="gm-tiles"><div><b>'+w+'</b><span>ชนะ</span></div><div><b>'+p+'</b><span>เล่น</span></div><div><b>'+Math.round(100*w/p)+'%</b><span>อัตราชนะ</span></div></div><div class="gm-rows">';
          var lbl=AI[cur]?AIL:LV;
          ORDER.forEach(function(c){var x=rs.filter(function(y){return y.cat===c;})[0];if(!x)return;
            var ex=STAT[cur]==='time'&&c!=='online'?(x.best_time!=null?'เร็วสุด '+fmtT(x.best_time):''):STAT[cur]==='score'&&x.best_score!=null?'สูงสุด '+x.best_score:'';
            h+='<div><span>'+(lbl[c]||c)+'</span><span>ชนะ '+x.wins+'/'+x.plays+(ex?' · '+ex:'')+'</span></div>';});
          h+='</div>';
        }
        h+='<p class="gm-note">'+line+'</p></div>';
      }else{
        h='<div class="gm-card"><div class="gm-h">ภาพรวมของฉัน</div><div class="gm-tiles"><div><b>'+(i>=0?'#'+(i+1):'–')+'</b><span>อันดับรวม</span></div><div><b>'+(me.points||0)+'</b><span>แต้ม</span></div><div><b>'+(me.wins||0)+'</b><span>ชนะ</span></div></div></div>';
      }
      st.innerHTML=h;
    },function(){if(my===tok)st.innerHTML='<div class="gm-card"><div class="gm-h">สถิติของฉัน</div><p class="gm-note" style="margin:0">โหลดสถิติไม่ได้ ลองใหม่อีกครั้ง</p></div>';});
  }
  Arcade.onChange(function(u){U=u;if(!box.hidden)paint(box);});
})();
</script>
</body>
</html>
