<title>Sudoku Pencil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sarabun:wght@400;500;700&display=swap">
<style>
/* Layout: เกมเต็มจอ — แถบบน / กระดาน 9x9 สี่เหลี่ยมจัตุรัส / แถบเครื่องมือ + แป้นตัวเลข; แนวนอนแยกเป็นซ้ายกระดาน ขวาปุ่ม */
:root{
  --bg:#eff1ee; --surface:#fbfcfb; --ink:#1c2430; --muted:#657080;
  --line:#c8cfd6; --line-strong:#2a3441;
  --accent:#17708f; --accent-ink:#ffffff; --user:#17708f;
  --peer:#e3eaee; --same:#c9dfe8; --sel:#a9cfdf; --hint:#ffe39a;
  --bad:#c23a2b; --bad-bg:#f8dcd7; --good:#2c8a57;
  --glow:rgba(23,112,143,.20); --f-ui:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-digit:'Fraunces',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161b; --surface:#1a2028; --ink:#e7ebf0; --muted:#93a0b0;
  --line:#313b47; --line-strong:#9aa8b8;
  --accent:#5cc0e0; --accent-ink:#0b1a22; --user:#6ccaea;
  --peer:#232c37; --same:#294456; --sel:#2f5d78; --hint:#6b5a1d;
  --bad:#ff8a7a; --bad-bg:#4a2723; --good:#6fd39b; --glow:rgba(92,192,224,.16); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161b; --surface:#1a2028; --ink:#e7ebf0; --muted:#93a0b0;
  --line:#313b47; --line-strong:#9aa8b8;
  --accent:#5cc0e0; --accent-ink:#0b1a22; --user:#6ccaea;
  --peer:#232c37; --same:#294456; --sel:#2f5d78; --hint:#6b5a1d;
  --bad:#ff8a7a; --bad-bg:#4a2723; --good:#6fd39b; --glow:rgba(92,192,224,.16); color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:8px 16px 10px;gap:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.ib{min-width:44px;height:40px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:500}
.hd{text-align:left;line-height:1.15;min-width:0}
.hd b{display:block;font-family:var(--f-digit);font-size:18px;font-weight:700}
.hd span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.hr{display:flex;align-items:center;gap:8px}
#ms{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
#ms.warn{color:var(--bad);font-weight:700}

main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px}
#bw{--bs:clamp(260px,min(100vw - 32px,480px,100dvh - 300px),480px);width:var(--bs);height:var(--bs);position:relative;flex:none}
#board{width:100%;height:100%;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);
  border:2.5px solid var(--line-strong);border-radius:6px;background:var(--surface);overflow:hidden}
.c{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-family:var(--f-digit);font-size:calc(var(--bs) / 9 * .58);font-weight:500;color:var(--user);cursor:pointer;min-width:0;min-height:0}
.c.cr{border-right:2px solid var(--line-strong)}
.c.cb{border-bottom:2px solid var(--line-strong)}
.c:nth-child(9n){border-right:0}
.c:nth-child(n+73){border-bottom:0}
.c.g{color:var(--ink);font-weight:700}
.c.pe{background:var(--peer)}
.c.sm{background:var(--same)}
.c.hi{background:var(--hint)}
.c.sl{background:var(--sel)}
.c.bad{color:var(--bad);background:var(--bad-bg)}
.c.bad.sl{background:var(--bad-bg);box-shadow:inset 0 0 0 2px var(--bad)}
.c.sl{box-shadow:inset 0 0 0 2px var(--accent)}
.nt{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  font-family:var(--f-ui);font-size:calc(var(--bs) / 9 * .25);font-weight:500;color:var(--muted);line-height:1;pointer-events:none}
.nt i{font-style:normal;display:flex;align-items:center;justify-content:center}
.nt i.on{color:var(--ink)}
#cover{position:absolute;inset:0;background:var(--surface);border:2.5px solid var(--line-strong);border-radius:6px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 22px;font-weight:700;font-size:16px}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}

#ctl{width:var(--bs-w,100%);max-width:480px;width:100%;display:flex;flex-direction:column;gap:10px;flex:none}
#tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tb{height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;line-height:1.1;gap:1px;position:relative}
.tb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tb:disabled{opacity:.4}
.tb em{position:absolute;top:2px;right:6px;font-style:normal;font-size:10px;font-weight:700}
#pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.pb{height:clamp(48px,8.5dvh,62px);border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--f-digit);font-size:25px;font-weight:500;color:var(--user);line-height:1}
.pb small{font-family:var(--f-ui);font-size:10px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.pb:disabled{opacity:.25}
.pb.hl{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

#hintcard{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);
  border-top:2px solid var(--line-strong);display:flex;flex-direction:column;gap:10px;z-index:5;max-width:900px;margin:0 auto}
#hintcard p{margin:0;font-size:16px;line-height:1.5}
#hintcard div{display:flex;gap:8px;justify-content:flex-end}

.ov{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;align-items:center;overflow:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.ov.dim{background:rgba(10,14,20,.6);justify-content:center}
.ov.dim .card{background:var(--surface)}
.card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.ov.dim .card{padding:22px;border-radius:16px;border:1px solid var(--line)}
h1{font-family:var(--f-digit);font-size:34px;line-height:1.1;margin:8px 0 0;font-weight:700;text-wrap:balance}
h2{font-family:var(--f-digit);font-size:24px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.lv{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.lv b{font-size:17px}
.lv small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.lv span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
.lv:active{background:var(--peer)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
td,th{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1;text-align:center;min-width:120px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{padding:10px 4px;border-radius:12px;background:var(--bg)}
.stat b{display:block;font-family:var(--f-digit);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;z-index:20;font-weight:500;max-width:90vw;text-align:center}
#opp{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding:2px 0}
#opp::-webkit-scrollbar{display:none}
#opp .oc{flex:1 0 74px;max-width:150px;display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 8px;min-width:74px}
#opp .oc.out{opacity:.5}
#opp .oc b{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#opp .oc span{white-space:nowrap}
#opp .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
#opp .bar i{display:block;height:100%;width:0;background:var(--good);transition:width .4s}
.rolechips{display:flex;gap:8px}
.rolechips button{flex:1;padding:8px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700}
.rolechips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plist .mut{color:var(--muted);font-size:13px}
.svc{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.svc h2 small{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.srow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.srow.win{outline:2px solid var(--accent)}.srow.out{opacity:.5}
.srow .sh{display:flex;justify-content:space-between;gap:8px}
.srow .sh em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.sbar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}.sbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.sbanner{text-align:center;font-weight:700;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--accent)}
.scards{display:flex;gap:8px;justify-content:center}
.scards b{min-width:46px;text-align:center;padding:10px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:22px}
#opp .oc.eye{flex:0 0 auto;min-width:0}
.plist{list-style:none;margin:8px 0 0;padding:0}
.plist li{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:10px;background:var(--bg);margin-top:6px}
.plist li.me{outline:2px solid var(--accent)}
.plist li em{font-style:normal;color:var(--muted);font-size:13px}
.lbl2{font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:700}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{padding:7px 12px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-weight:700;font-size:14px}
.mchip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.code{font-family:var(--f-digit);font-size:44px;letter-spacing:.14em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
input.cin{font:inherit;font-family:var(--f-digit);font-size:32px;letter-spacing:.2em;text-align:center;width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.c.win{animation:pop .5s ease both}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.c.win{animation:none}}


/* ---- polish v2 ---- */
body{background:radial-gradient(130% 42% at 50% -6%,var(--glow),transparent 62%),var(--bg);background-attachment:fixed}
main{justify-content:flex-start;padding-top:14px}
html{--bsz:clamp(260px,min(100vw - 32px,500px,100dvh - 300px),500px)}
#bw{--bs:var(--bsz)}
#board{box-shadow:0 10px 30px rgba(20,40,60,.14),0 2px 0 rgba(20,40,60,.1)}
.c{transition:background .12s}
.c .v{display:block}
.c.pp .v{animation:pp .28s cubic-bezier(.2,1.5,.4,1)}
@keyframes pp{0%{transform:scale(.4);opacity:.2}100%{transform:scale(1);opacity:1}}
.c.fl{animation:fl .7s ease both}
@keyframes fl{0%{background:var(--surface)}35%{background:var(--hint);transform:scale(1.08);z-index:2}100%{background:var(--surface)}}
.pb{box-shadow:0 2px 0 rgba(20,40,60,.14);transition:transform .08s,box-shadow .08s,background .15s;height:clamp(52px,9dvh,68px)}
.pb:active:not(:disabled){transform:translateY(2px);box-shadow:none;background:var(--peer)}
.tb{box-shadow:0 2px 0 rgba(20,40,60,.1)}
.tb:active:not(:disabled){transform:translateY(1px);box-shadow:none}
#prog{width:var(--bsz);flex:none;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:0 2px}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .35s}
.hero{display:flex;align-items:center;gap:14px;margin-top:6px}
.hero svg{width:68px;height:68px;flex:none;border-radius:16px;box-shadow:0 6px 16px rgba(23,112,143,.35)}
.hero h1{margin:0}
.hero .sub{font-size:14px}
.lv{background:linear-gradient(180deg,var(--surface),var(--bg));box-shadow:0 2px 0 rgba(20,40,60,.08);transition:transform .1s,box-shadow .1s;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px}
.lv:active{transform:translateY(2px);box-shadow:none}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.btn{box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.c.pp .v,.c.fl{animation:none}}
@media (orientation:landscape) and (max-height:560px){html{--bsz:clamp(220px,calc(100dvh - 78px),500px)}#prog{display:none}}
@media (orientation:landscape) and (max-height:560px){
  #app{padding-top:4px;padding-bottom:6px;gap:4px}
  main{flex-direction:row;align-items:center;justify-content:center;gap:16px}
  #bw{--bs:clamp(220px,calc(100dvh - 66px),480px)}
  #ctl{width:min(300px,40vw);max-width:none}
  #pad{grid-template-columns:repeat(3,1fr)}
  .pb{height:clamp(40px,10dvh,56px)}
  header{min-height:38px}
}
@media (max-width:360px){.pb{font-size:22px}.tb{font-size:12px}}
</style>

<script>
/* ดอกไม้ไฟกระดาษ (เฉลิมฉลองตอนชนะ) */
window.Confetti=(function(){
  var cv,cx,parts=[],raf=0,t0=0;
  function loop(ts){
    if(!t0)t0=ts;var dt=Math.min(32,ts-(loop.l||ts));loop.l=ts;
    cx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(function(p){
      p.vy+=0.0016*dt*dpr();p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.995;p.r+=p.vr*dt;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,Math.min(1,(2600-(ts-t0))/700));
      cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
    });
    if(ts-t0<2600)raf=requestAnimationFrame(loop);else stop();
  }
  function dpr(){return window.devicePixelRatio||1;}
  function stop(){cancelAnimationFrame(raf);raf=0;if(cv&&cv.parentNode)cv.parentNode.removeChild(cv);cv=null;parts=[];t0=0;loop.l=0;}
  function burst(colors){
    try{
      if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      stop();colors=colors||['#ffcf5a','#2f9e6a','#2a9cc2','#ff917c','#f3eee1'];
      cv=document.createElement('canvas');cv.setAttribute('aria-hidden','true');cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:90';
      cv.width=innerWidth*dpr();cv.height=innerHeight*dpr();document.body.appendChild(cv);cx=cv.getContext('2d');
      var d=dpr(),W=cv.width;
      for(var i=0;i<130;i++){
        var side=i%2?0.15:0.85,a=(Math.random()*0.9+0.15)*Math.PI*(side<0.5?-0.55:-0.45)-Math.random()*0.3;
        var sp=(0.5+Math.random()*0.9)*d;
        parts.push({x:W*side,y:cv.height*0.78,vx:Math.cos(a)*sp*(side<0.5?1:-1)*(0.6+Math.random()),vy:-(0.8+Math.random()*0.9)*d*1.2,w:(5+Math.random()*6)*d,h:(8+Math.random()*8)*d,r:Math.random()*6,vr:(Math.random()-.5)*0.02,c:colors[i%colors.length]});
      }
      raf=requestAnimationFrame(loop);
    }catch(e){}
  }
  return{burst:burst,stop:stop};
})();
</script>

/* ===== อิโมจิ/สติกเกอร์ในเกม: ปุ่มลอย + ถาดเลือก + ข้อความลอยของทุกคน + บอทส่งสติกเกอร์กวนๆ ===== */

    <p class="sub">เติมเลข 1–9 ให้ครบทุกแถว ทุกคอลัมน์ และทุกกล่อง 3×3 โดยไม่ซ้ำกัน ทุกโจทย์มีคำตอบเดียว</p>
    <button class="btn" id="bCont" hidden>เล่นต่อ</button>
    <div id="levels"></div>
    <div id="pvp" style="border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px">
      <h2 style="font-size:20px">เล่นกับเพื่อน</h2>
      <p class="sub" id="pvpSub">ได้โจทย์เดียวกัน ใครไขเสร็จก่อนชนะ</p>
      <div class="row"><button class="btn" id="bHost" disabled>สร้างห้อง</button><button class="btn alt" id="bJoin" disabled>เข้าห้อง</button></div>
      <p class="sub" id="pvpStat"></p>
    </div>
    <div id="statBox"></div>
    <label style="display:flex;gap:10px;align-items:center;padding:6px 2px"><input type="checkbox" id="optFb" style="width:20px;height:20px"> <span>ตรวจคำตอบทันที (นับเป็นผิดเมื่อใส่เลขไม่ตรงเฉลย)</span></label>
  </div>
</div>

<div class="ov dim" id="modal" hidden><div class="card" id="modalCard"></div></div>
<div class="ov dim" id="busy" hidden><div class="card" style="text-align:center"><div class="spin"></div><div id="busyTxt">กำลังสร้างโจทย์…</div></div></div>
<div id="toast" hidden></div>

<script>
/*==CORE-START==*/
const SudokuCore=(function(){
  const ROW=[],COL=[],BOX=[],PEERS=[],UNITS=[];
  for(let i=0;i<81;i++){ROW[i]=(i/9)|0;COL[i]=i%9;BOX[i]=((ROW[i]/3)|0)*3+((COL[i]/3)|0);}
  for(let i=0;i<81;i++){const p=[];for(let j=0;j<81;j++)if(j!==i&&(ROW[j]===ROW[i]||COL[j]===COL[i]||BOX[j]===BOX[i]))p.push(j);PEERS[i]=p;}
  for(let r=0;r<9;r++){const u=[];for(let c=0;c<9;c++)u.push(r*9+c);UNITS.push({name:'แถวที่ '+(r+1),cells:u});}
  for(let c=0;c<9;c++){const u=[];for(let r=0;r<9;r++)u.push(r*9+c);UNITS.push({name:'คอลัมน์ที่ '+(c+1),cells:u});}
  for(let b=0;b<9;b++){const u=[];for(let i=0;i<81;i++)if(BOX[i]===b)u.push(i);UNITS.push({name:'กล่องที่ '+(b+1),cells:u});}
  const FULL=0x3fe;
  const bc=m=>{let c=0;while(m){m&=m-1;c++;}return c;};
  function shuffle(a,rng){rng=rng||Math.random;for(let i=a.length-1;i>0;i--){const j=(rng()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t;}return a;}

  function search(g,limit,rnd){
    const r=new Array(9).fill(0),c=new Array(9).fill(0),b=new Array(9).fill(0),a=g.slice();
    for(let i=0;i<81;i++)if(a[i]){
      const bit=1<<a[i];
      if((r[ROW[i]]&bit)||(c[COL[i]]&bit)||(b[BOX[i]]&bit))return{n:0,sol:null};
      r[ROW[i]]|=bit;c[COL[i]]|=bit;b[BOX[i]]|=bit;
    }
    let n=0,sol=null;
    function rec(){
      let best=-1,bm=0,bk=10;
      for(let i=0;i<81;i++)if(!a[i]){
        const m=FULL&~(r[ROW[i]]|c[COL[i]]|b[BOX[i]]),k=bc(m);
        if(k<bk){bk=k;best=i;bm=m;if(k<=1)break;}
      }
      if(best<0){n++;if(!sol)sol=a.slice();return n>=limit;}
      if(bk===0)return false;
      const ds=[];for(let d=1;d<=9;d++)if(bm&(1<<d))ds.push(d);
      if(rnd)shuffle(ds);
      for(const d of ds){
        const bit=1<<d;
        a[best]=d;r[ROW[best]]|=bit;c[COL[best]]|=bit;b[BOX[best]]|=bit;
        if(rec())return true;
        r[ROW[best]]^=bit;c[COL[best]]^=bit;b[BOX[best]]^=bit;
      }
      a[best]=0;return false;
    }
    rec();
    return{n,sol};
  }
  function cands(vals){
    const out=new Array(81).fill(0);
    for(let i=0;i<81;i++)if(!vals[i]){
      let m=FULL;
      for(const j of PEERS[i])if(vals[j])m&=~(1<<vals[j]);
      out[i]=m;
    }
    return out;
  }
  /* mode 'naked' = ใช้เฉพาะช่องที่เหลือตัวเลือกเดียว, 'hidden' = เพิ่มเลขที่ลงได้ช่องเดียวในแถว/คอลัมน์/กล่อง */
  function solvableBy(g,mode){
    const a=g.slice();
    for(;;){
      const cm=cands(a);let did=false,left=0;
      for(let i=0;i<81;i++)if(!a[i]){
        left++;
        if(cm[i]===0)return false;
        if(bc(cm[i])===1){a[i]=Math.log2(cm[i])|0;did=true;}
      }
      if(!left)return true;
      if(did)continue;
      if(mode==='hidden'){
        for(const u of UNITS){
          for(let d=1;d<=9&&!did;d++){
            let cnt=0,at=-1;
            for(const i of u.cells)if(!a[i]&&(cm[i]&(1<<d))){cnt++;at=i;}
            if(cnt===1){a[at]=d;did=true;}
          }
          if(did)break;
        }
      }
      if(!did)return false;
    }
  }
  const LEVELS={
    easy:  {name:'ง่าย',     clues:40,single:'naked', ms:700},
    medium:{name:'กลาง',     clues:34,single:'hidden',ms:900},
    hard:  {name:'ยาก',      clues:28,single:null,    ms:1300},
    expert:{name:'โหด',      clues:22,single:null,    ms:2500}
  };
  function generate(level,rng){
    const L=LEVELS[level],t0=Date.now();let best=null;
    do{
      const full=search(new Array(81).fill(0),1,true).sol;
      const p=full.slice(),order=shuffle([...Array(81).keys()],rng);
      let clues=81;
      for(const i of order){
        if(clues<=L.clues)break;
        const keep=p[i];p[i]=0;
        if(search(p,2,false).n===1&&(!L.single||solvableBy(p,L.single)))clues--;else p[i]=keep;
      }
      if(!best||clues<best.clues)best={puzzle:p.slice(),sol:full,clues};
      if(clues<=L.clues)break;
    }while(Date.now()-t0<L.ms||!best);
    return best;
  }
  function conflicts(vals){
    const bad=new Array(81).fill(false);
    for(let i=0;i<81;i++)if(vals[i])for(const j of PEERS[i])if(vals[j]===vals[i]){bad[i]=true;break;}
    return bad;
  }
  function findHint(vals,sol){
    for(let i=0;i<81;i++)if(vals[i]&&vals[i]!==sol[i])
      return{kind:'wrong',i,v:0,text:'ช่อง แถวที่ '+(ROW[i]+1)+' คอลัมน์ที่ '+(COL[i]+1)+' ใส่เลขผิดอยู่ ลบออกก่อนแล้วลองใหม่'};
    const cm=cands(vals);
    for(let i=0;i<81;i++)if(!vals[i]&&bc(cm[i])===1){
      const v=Math.log2(cm[i])|0;
      return{kind:'naked',i,v,text:'ช่อง แถวที่ '+(ROW[i]+1)+' คอลัมน์ที่ '+(COL[i]+1)+' ใส่ได้เลขเดียวคือ '+v+' เพราะเลขอื่นอยู่ในแถว คอลัมน์ หรือกล่องเดียวกันครบแล้ว'};
    }
    for(const u of UNITS)for(let d=1;d<=9;d++){
      let cnt=0,at=-1,has=false;
      for(const i of u.cells){if(vals[i]===d)has=true;else if(!vals[i]&&(cm[i]&(1<<d))){cnt++;at=i;}}
      if(!has&&cnt===1)
        return{kind:'hidden',i:at,v:d,text:'ใน'+u.name+' เลข '+d+' ลงได้ช่องเดียว คือช่อง แถวที่ '+(ROW[at]+1)+' คอลัมน์ที่ '+(COL[at]+1)};
    }
    let bi=-1,bk=10;
    for(let i=0;i<81;i++)if(!vals[i]){const k=bc(cm[i]);if(k<bk){bk=k;bi=i;}}
    if(bi<0)return null;
    return{kind:'direct',i:bi,v:sol[bi],text:'ข้อนี้ต้องใช้เทคนิคขั้นสูง ช่อง แถวที่ '+(ROW[bi]+1)+' คอลัมน์ที่ '+(COL[bi]+1)+' คือเลข '+sol[bi]};
  }
  return{ROW,COL,BOX,PEERS,UNITS,LEVELS,search,generate,cands,solvableBy,conflicts,findHint,bc,shuffle};
})();
if(typeof module!=='undefined')module.exports=SudokuCore;
/*==CORE-END==*/

(function(){
'use strict';
const C=SudokuCore,$=id=>document.getElementById(id);
const LSK={save:'sudoku.save.v1',stats:'sudoku.stats.v1',opt:'sudoku.opt.v1'};
const ls={
  get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};
let popIdx=-1,S=null,sel=-1,noteMode=false,paused=false,hintObj=null,hlDigit=0,busy=false;
const fbOn=()=>!!(S&&S.online)||opt.fb;
let opt=Object.assign({fb:true},ls.get(LSK.opt)||{});

/* ---------- build board & pad ---------- */
const board=$('board'),cells=[];
for(let i=0;i<81;i++){
  const d=document.createElement('div');
  d.className='c'+(C.COL[i]%3===2&&C.COL[i]<8?' cr':'')+(C.ROW[i]%3===2&&C.ROW[i]<8?' cb':'');
  d.dataset.i=i;
  d.innerHTML='<span class="v"></span><span class="nt">'+[1,2,3,4,5,6,7,8,9].map(n=>'<i data-n="'+n+'"></i>').join('')+'</span>';
  board.appendChild(d);cells.push({el:d,v:d.firstChild,nt:d.lastChild,ni:[...d.lastChild.children]});
}
board.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.c');if(!c||!S||paused)return;
  e.preventDefault();select(+c.dataset.i);
});
const pad=$('pad'),padBtns=[];
for(let d=1;d<=9;d++){
  const b=document.createElement('button');b.className='pb';b.innerHTML=d+'<small></small>';
  b.setAttribute('aria-label','เลข '+d);
  b.addEventListener('click',()=>input(d));pad.appendChild(b);padBtns.push(b);
}

/* ---------- state ---------- */
function newState(level,g){
  return{level,puzzle:g.puzzle,sol:g.sol,vals:g.puzzle.slice(),notes:new Array(81).fill(0),
    time:0,mistakes:0,hints:0,hist:[],done:false};
}
function snap(){
  S.hist.push({v:S.vals.slice(),n:S.notes.slice()});
  if(S.hist.length>150)S.hist.shift();
}
function save(){
  if(!S||S.done||S.online)return;
  ls.set(LSK.save,{level:S.level,puzzle:S.puzzle,sol:S.sol,vals:S.vals,notes:S.notes,time:S.time,mistakes:S.mistakes,hints:S.hints});
}

/* ---------- render ---------- */
function fmt(t){const m=(t/60)|0,s=t%60;return(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function render(){
  if(!S)return;
  const conf=C.conflicts(S.vals);
  const sv=sel>=0?S.vals[sel]:0,focusD=sv||hlDigit;
  const counts=new Array(10).fill(0);
  for(let i=0;i<81;i++){
    const v=S.vals[i],c=cells[i];
    if(v&&v===S.sol[i])counts[v]++;
    c.v.textContent=v||'';
    let cls='c'+(C.COL[i]%3===2&&C.COL[i]<8?' cr':'')+(C.ROW[i]%3===2&&C.ROW[i]<8?' cb':'');
    if(S.puzzle[i])cls+=' g';
    if(sel>=0&&i!==sel&&(C.ROW[i]===C.ROW[sel]||C.COL[i]===C.COL[sel]||C.BOX[i]===C.BOX[sel]))cls+=' pe';
    if(focusD&&v===focusD)cls+=' sm';
    if(i===sel)cls+=' sl';
    if(i===popIdx)cls+=' pp';
    if(hintObj&&hintObj.i===i)cls+=' hi';
    if(v&&!S.puzzle[i]&&(conf[i]||(fbOn()&&v!==S.sol[i])))cls+=' bad';
    c.el.className=cls;
    c.nt.style.display=v?'none':'';
    if(!v){const m=S.notes[i];for(let k=0;k<9;k++){const on=!!(m&(2<<k));c.ni[k].textContent=on?k+1:'';c.ni[k].className=(on&&focusD===k+1)?'on':'';}}
  }
  popIdx=-1;
  {let ok=0,tot=0;for(let i=0;i<81;i++)if(!S.puzzle[i]){tot++;if(S.vals[i]===S.sol[i])ok++;}$('progBar').style.width=(tot?ok/tot*100:100)+'%';}
  padBtns.forEach((b,k)=>{const d=k+1,left=9-counts[d];b.disabled=left<=0;b.lastChild.textContent=left>0?left:'';b.classList.toggle('hl',focusD===d);});
  $('lvName').textContent=C.LEVELS[S.level].name;
  $('tm').textContent=fmt(S.time);
  const ms=$('ms');ms.textContent=fbOn()?'ผิด '+S.mistakes:'';ms.classList.toggle('warn',S.mistakes>=3);
  $('bUndo').disabled=!S.hist.length;
  $('opp').hidden=!S.online;$('bPause').hidden=!!S.online;$('bHint').disabled=!!S.online;
  if(S.online)reportProg();
  const nb=$('bNote');nb.classList.toggle('on',noteMode);nb.lastChild.textContent='โน้ต: '+(noteMode?'เปิด':'ปิด');
}

/* ---------- actions ---------- */
function select(i){sel=i;hlDigit=0;render();}
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true;},1800);}
function closeHint(){hintObj=null;$('hintcard').hidden=true;}
function input(d){
  if(!S||S.done||paused)return;
  if(sel<0||S.puzzle[sel]){hlDigit=hlDigit===d?0:d;sel=sel>=0&&S.puzzle[sel]?-1:sel;render();return;}
  closeHint();
  const i=sel;
  if(noteMode){
    if(S.vals[i])return;
    snap();S.notes[i]^=(1<<d);render();save();return;
  }
  if(S.vals[i]===d){erase();return;}
  snap();
  S.vals[i]=d;S.notes[i]=0;popIdx=i;
  for(const j of C.PEERS[i])S.notes[j]&=~(1<<d);
  if(fbOn()&&d!==S.sol[i]){S.mistakes++;toast('ไม่ถูกต้อง');}
  render();save();flashUnits(i);checkWin();
}
function flashUnits(i){
  if(!S||S.vals[i]!==S.sol[i])return;
  const units=[C.UNITS[C.ROW[i]],C.UNITS[9+C.COL[i]],C.UNITS[18+C.BOX[i]]];
  units.forEach(u=>{
    if(!u.cells.every(k=>S.vals[k]===S.sol[k]))return;
    u.cells.forEach((k,n)=>{const el=cells[k].el;el.classList.remove('fl');void el.offsetWidth;el.style.animationDelay=(Math.abs(u.cells.indexOf(i)-n)*45)+'ms';el.classList.add('fl');});
    setTimeout(()=>u.cells.forEach(k=>{cells[k].el.classList.remove('fl');cells[k].el.style.animationDelay='';}),1100);
  });
}
function erase(){
  if(!S||S.done||paused||sel<0||S.puzzle[sel])return;
  if(!S.vals[sel]&&!S.notes[sel])return;
  closeHint();snap();S.vals[sel]=0;S.notes[sel]=0;render();save();
}
function undo(){
  if(!S||S.done||paused||!S.hist.length)return;
  closeHint();const h=S.hist.pop();S.vals=h.v;S.notes=h.n;render();save();
}
function hint(){
  if(!S||S.done||paused||S.online)return;
  const h=C.findHint(S.vals,S.sol);if(!h)return;
  hintObj=h;sel=h.i;hlDigit=0;
  $('hintTxt').textContent=h.text;
  $('hintApply').textContent=h.kind==='wrong'?'ลบให้':'เติมให้';
  $('hintcard').hidden=false;render();
}
function applyHint(){
  if(!hintObj)return;
  const h=hintObj;snap();S.hints++;
  if(h.kind==='wrong'){S.vals[h.i]=0;S.notes[h.i]=0;}
  else{S.vals[h.i]=h.v;S.notes[h.i]=0;for(const j of C.PEERS[h.i])S.notes[j]&=~(1<<h.v);}
  closeHint();render();save();checkWin();
}
function checkWin(){
  if(S.vals.some((v,k)=>v!==S.sol[k])){
    if(S.vals.every(v=>v)&&!fbOn())toast('ยังมีช่องที่ผิดอยู่ ลองหาดู');
    return;
  }
  if(S.online){onlineIFinished();return;}
  S.done=true;ls.del(LSK.save);
  const st=ls.get(LSK.stats)||{},e=st[S.level]||{played:0,won:0,best:0};
  e.won++;const nb=!e.best||S.time<e.best;if(nb)e.best=S.time;st[S.level]=e;ls.set(LSK.stats,st);
  cells.forEach((c,i)=>{c.el.classList.add('win');c.el.style.animationDelay=((C.ROW[i]+C.COL[i])*30)+'ms';});
  if(window.Confetti)setTimeout(()=>Confetti.burst(),500);
  setTimeout(()=>showWin(nb,e.best),900);
}
function showWin(nb,best){
  const mc=$('modalCard');
  mc.innerHTML='<h2>เก่งมาก! ไขได้แล้ว</h2><p class="sub">ระดับ'+C.LEVELS[S.level].name+(nb?' · สถิติใหม่ที่เร็วที่สุด':'')+'</p>'+
   '<div class="stat"><div><b>'+fmt(S.time)+'</b><span>เวลา</span></div><div><b>'+S.mistakes+'</b><span>ใส่ผิด</span></div><div><b>'+S.hints+'</b><span>ใช้ใบ้</span></div></div>'+
   '<p class="sub">เร็วที่สุดของระดับนี้ '+fmt(best)+'</p>'+
   '<div class="row"><button class="btn" id="mAgain">เล่นระดับนี้อีก</button><button class="btn alt" id="mMenu">เมนู</button></div>';
  $('modal').hidden=false;
  const lv=S.level;
  $('mAgain').onclick=()=>{$('modal').hidden=true;start(lv);};
  $('mMenu').onclick=()=>{$('modal').hidden=true;showMenu();};
}
function setPaused(p){
  if(!S||S.done)return;paused=p;$('cover').hidden=!p;
  $('bPause').textContent=p?'เล่นต่อ':'พัก';
}

/* ---------- game start / menu ---------- */
function start(level){
  if(busy)return;busy=true;
  $('menu').hidden=true;$('busyTxt').textContent='กำลังสร้างโจทย์ระดับ'+C.LEVELS[level].name+'…';$('busy').hidden=false;
  setTimeout(()=>{
    let g;try{g=C.generate(level);}catch(e){g=null;}
    $('busy').hidden=true;busy=false;
    if(!g){toast('สร้างโจทย์ไม่สำเร็จ ลองอีกครั้ง');showMenu();return;}
    const st=ls.get(LSK.stats)||{},e=st[level]||{played:0,won:0,best:0};e.played++;st[level]=e;ls.set(LSK.stats,st);
    begin(level,g,false);
  },60);
}
function begin(level,g,online){
  S=newState(level,g);S.online=!!online;sel=-1;hlDigit=0;noteMode=false;closeHint();setPaused(false);
  $('menu').hidden=true;$('busy').hidden=true;
  render();save();
}
function resume(){
  const sv=ls.get(LSK.save);if(!sv)return;
  S=Object.assign(newState(sv.level,sv),{vals:sv.vals,notes:sv.notes,time:sv.time||0,mistakes:sv.mistakes||0,hints:sv.hints||0});
  sel=-1;hlDigit=0;noteMode=false;closeHint();setPaused(false);$('menu').hidden=true;render();
}
function showMenu(){
  if(S&&!S.done){save();setPaused(true);}
  const sv=ls.get(LSK.save),st=ls.get(LSK.stats)||{};
  $('bCont').hidden=!sv;
  if(sv)$('bCont').textContent='เล่นต่อ · ระดับ'+C.LEVELS[sv.level].name+' · '+fmt(sv.time||0);
  const desc={easy:'เหมาะกับเริ่มต้น เจอช่องที่ใส่ได้แน่ๆ ตลอด',medium:'ต้องมองหาเลขที่ลงได้ช่องเดียว',hard:'เบาะแสน้อย ต้องใช้โน้ตช่วย',expert:'เบาะแสน้อยที่สุด อาจต้องลองเดา'};
  $('levels').innerHTML=Object.keys(C.LEVELS).map(k=>{
    const e=st[k]||{};
    const n=Object.keys(C.LEVELS).indexOf(k)+1;

function loadLib(src){

/* ทำให้ Supabase หน้าตาเหมือน room ของ Claude: join(name) -> {presence(patch), onPeers(fn), leave()} */
function supabaseNS(){
  let client=null;
  let myCid=ls.get('sudoku.cid.v1');
  if(!myCid){myCid='c'+Math.random().toString(36).slice(2,10);ls.set('sudoku.cid.v1',myCid);}
  return{join(name){
    return loadLib(SUPA.lib).then(()=>{
      if(!client)client=window.supabase.createClient(SUPA.url,SUPA.key,{auth:{persistSession:false,autoRefreshToken:false},realtime:{params:{eventsPerSecond:20}}});
      return new Promise((resolve,reject)=>{
        const myId='u'+Math.random().toString(36).slice(2,10);
        const ch=client.channel('sudoku-'+name,{config:{presence:{key:myId}}});
        let mine={},handlers=[],settled=false,left=false;
        const track=()=>{try{const r=ch.track({p:mine,cid:myCid});if(r&&r.catch)r.catch(noop);}catch(e){}};
        const list=()=>{
          const st=ch.presenceState(),out=[];
          Object.keys(st).forEach(k=>{const m=st[k]&&st[k][st[k].length-1];if(!m)return;
            out.push({peer:k,by:m.cid||k,isMe:k===myId,sameTab:k===myId,presence:(k===myId?mine:m.p)||{}});});
          return out;
        };
        const notify=()=>{if(left)return;const ps=list();handlers.slice().forEach(h=>{try{h({peers:ps});}catch(e){if(window.console)console.error(e);}});};
        ch.on('presence',{event:'sync'},notify);
        const room={
          presence(patch){
            if(left)return Promise.reject({code:'invalid_argument'});
            const m=Object.assign({},mine);
            Object.keys(patch).forEach(k=>{if(patch[k]===null||patch[k]===undefined)delete m[k];else m[k]=patch[k];});
            mine=m;track();notify();return Promise.resolve();
          },
          onPeers(h){handlers.push(h);setTimeout(()=>{if(handlers.indexOf(h)>=0){try{h({peers:list()});}catch(e){}}},0);return()=>{handlers=handlers.filter(x=>x!==h);};},
          leave(){left=true;handlers=[];try{ch.untrack();client.removeChannel(ch);}catch(e){}return Promise.resolve();}
        };
        ch.subscribe(status=>{
          if(status==='SUBSCRIBED'){track();if(!settled){settled=true;resolve(room);}}
          else if((status==='CHANNEL_ERROR'||status==='TIMED_OUT')&&!settled){settled=true;try{client.removeChannel(ch);}catch(e){}reject({code:'upstream_error'});}
        });
        setTimeout(()=>{if(!settled){settled=true;try{client.removeChannel(ch);}catch(e){}reject({code:'upstream_error'});}},10000);
      });
    });
  }};
}

function rosterHost(me){

let maxSel=+(ls.get('mp.max.v1')||2);
function maxChips(){
  return '<div class="lbl2">จำนวนผู้เล่นสูงสุด</div><div class="mchips" id="mchips">'+[2,3,4,5,6,7,8].map(n=>'<button class="mchip" data-n="'+n+'" aria-pressed="'+(n===maxSel)+'">'+n+' คน</button>').join('')+'</div>';
}
function bindMaxChips(){
  document.querySelectorAll('#mchips .mchip').forEach(b=>b.onclick=()=>{maxSel=+b.dataset.n;ls.set('mp.max.v1',maxSel);document.querySelectorAll('#mchips .mchip').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.n===maxSel)));});
}
/*==MP-END==*/
/*==ONLINE-START==*/
/* ---------- Sudoku ออนไลน์ หลายคน: ไขโจทย์เดียวกัน ใครเสร็จก่อนชนะ ---------- */
function oppUpdate(){
  if(!on||!S||!S.online||!on.started)return;
  const total=81-S.puzzle.filter(Boolean).length,ops=on.pl.filter(p=>p!==on.meId);
  $('opp').innerHTML=(on.sp.length?'<div class="oc eye"><b>👁 '+on.sp.length+'</b></div>':'')+ops.map(p=>{
    const o=on.peers[p]||{},valid=o.r===on.rid,pr=valid?(o.prog||0):0,out=isOut(on,p);
    return'<div class="oc'+(out?' out':'')+'"><b>'+esc(nameOf(on,p))+'</b><div class="bar"><i style="width:'+Math.round(pr/total*100)+'%"></i></div><span>'+(out?'ออกแล้ว':pr+'/'+total+(valid&&o.mis?' ✗'+o.mis:''))+'</span></div>';
  }).join('');
  if(S.done||on.over)return;
  let fin=null;
  ops.forEach(p=>{const o=on.peers[p];if(o&&o.r===on.rid&&o.fin!=null&&(!fin||o.fin<fin.t))fin={p,t:o.fin};});
  if(fin){endOnline('lose',nameOf(on,fin.p)+' ไขเสร็จก่อน');return;}
  if(ops.length&&ops.every(p=>isOut(on,p)))endOnline('win','ทุกคนออกจากห้องแล้ว');
}
function standings(){
  const total=81-S.puzzle.filter(Boolean).length,rows=[];
  on.pl.forEach(p=>{
    const me=p===on.meId,o=me?{r:on.rid,prog:progress(),fin:S.finT}:(on.peers[p]||{});
    const valid=o.r===on.rid;
    rows.push({n:nameOf(on,p)+(me?' (คุณ)':''),fin:valid&&o.fin!=null?o.fin:null,prog:valid?(o.prog||0):0,out:isOut(on,p),me});
  });
  rows.sort((a,b)=>(a.fin!=null?0:1)-(b.fin!=null?0:1)||(a.fin!=null?a.fin-b.fin:0)||(a.out-b.out)||b.prog-a.prog);
  return{total,rows};
}
function endOnline(res,why){
  if(!on||on.over)return;on.over=true;S.done=true;
  if(res==='win')S.finT=S.finT!=null?S.finT:S.time;
  const st=ls.get('sudoku.pvp.v1')||{w:0,l:0};if(res==='win')st.w++;else st.l++;ls.set('sudoku.pvp.v1',st);
  if(res==='win'&&window.Confetti)Confetti.burst();
  const host=on.role==='host',sd=standings();
  const list='<ol class="plist rank">'+sd.rows.map((r,i)=>'<li'+(r.me?' class="me"':'')+'><span><b>'+(i+1)+'.</b> '+esc(r.n)+'</span><em>'+(r.fin!=null?fmt(r.fin):(r.out?'ออกแล้ว':r.prog+'/'+sd.total))+'</em></li>').join('')+'</ol>';
  openModal('<h2>'+(res==='win'?'คุณชนะ!':'จบรอบ')+'</h2><p class="sub">'+why+'</p><div class="stat"><div><b>'+fmt(S.time)+'</b><span>เวลาของคุณ</span></div><div><b>'+progress()+'/'+sd.total+'</b><span>ของคุณ</span></div></div>'+list+
    '<div class="row">'+(host?'<button class="btn" id="mAgain">เล่นอีกรอบ</button>':'<button class="btn" id="mAgain" disabled>รอเจ้าของห้องเริ่มรอบใหม่</button>')+'<button class="btn alt" id="mLeave">ออกจากห้อง</button></div>');
  if(host)$('mAgain').onclick=()=>{startRound();};
  $('mLeave').onclick=()=>{closeModal();leaveOnline();S=null;showMenu();};
}
function onlineIFinished(){
  if(!on)return;
  const ops=on.pl.filter(p=>p!==on.meId);
  const earlier=ops.some(p=>{const o=on.peers[p];return o&&o.r===on.rid&&o.fin!=null&&o.fin<=S.time;});
  if(earlier){oppUpdate();return;}
  S.finT=S.time;
  pres({fin:S.time,prog:progress()});
  endOnline('win','คุณไขเสร็จก่อน');
}
function askLeave(){
  openModal('<h2>ออกจากห้อง?</h2><p class="sub">การออกระหว่างแข่งนับว่ายอมแพ้</p><div class="row"><button class="btn" id="mLv">ออกจากห้อง</button><button class="btn alt" id="mStay">เล่นต่อ</button></div>');
  $('mStay').onclick=closeModal;
  $('mLv').onclick=()=>{
    closeModal();
    const st=ls.get('sudoku.pvp.v1')||{w:0,l:0};st.l++;ls.set('sudoku.pvp.v1',st);
    if(on){on.over=true;pres({rs:1});}
    S.done=true;setTimeout(leaveOnline,400);S=null;showMenu();
  };
}
/* --- เจ้าของห้อง --- */
function askHostLevel(){
  openModal('<h2>สร้างห้อง</h2>'+maxChips()+'<div class="lbl2">เลือกระดับโจทย์</div>'+
    Object.keys(C.LEVELS).map(k=>'<button class="lv" data-lv="'+k+'"><div><b>'+C.LEVELS[k].name+'</b></div></button>').join('')+
    '<button class="btn alt" id="mX">ยกเลิก</button>');
  bindMaxChips();
  $('mX').onclick=closeModal;
  $('modalCard').querySelectorAll('.lv').forEach(b=>b.onclick=()=>hostOpen(b.dataset.lv));
}
function hostOpen(level){
  mpHost(maxSel,'ระดับ'+C.LEVELS[level].name+' · ได้โจทย์เดียวกัน ใครไขเสร็จก่อนชนะ เล่นได้ 2–8 คน',{level,rid:0});
}
function startRound(){
  const me=on;if(!me)return;
  me.pl=me.pl.filter(p=>p===me.meId||!isOut(me,p));
  if(me.pl.length<2){toast('ผู้เล่นคนอื่นออกจากห้องหมดแล้ว');return;}
  me.st=1;mpPub(me);
  closeModal();$('busyTxt').textContent='กำลังสร้างโจทย์…';$('busy').hidden=false;
  setTimeout(()=>{
    if(on!==me)return;
    let g;try{g=C.generate(me.level);}catch(e){g=null;}
    $('busy').hidden=true;
    if(!g){toast('สร้างโจทย์ไม่สำเร็จ');return;}
    me.rid++;me.started=true;me.over=false;me.sentProg=0;me.sentMis=0;
    if(me.hw==='s'){me.pz=g.puzzle.join('');me.lv=me.level;me.go=Date.now();pres({pz:me.pz,lv:me.level,rid:me.rid,go:me.go});sdSpecStart(me);return;}
    begin(me.level,g,true);
    pres({pz:g.puzzle.join(''),lv:me.level,rid:me.rid,r:me.rid,go:Date.now(),prog:0,mis:0,fin:null,rs:null});
    oppUpdate();
  },60);
}
/* --- ผู้เล่นที่เข้าห้อง --- */
function guestFail(me,msg){if(on!==me)return;closeModal();$('busy').hidden=true;leaveOnline();toast(msg);if(S&&S.online){S=null;showMenu();}}
/* --- คนดู: เห็นความคืบหน้าของผู้เล่นทุกคน (ไม่เห็นกระดานของใคร) --- */
function sdSpecStart(me){me.spec=true;specOpen();sdSpecRender(me);}
function sdSpecRender(me){
  if(on!==me||!me.spec||!me.started)return;
  const total=Math.max(1,(me.pz||'').split('').filter(c=>c==='0').length);
  const rows=me.pl.map(p=>{const o=me.peers[p]||{},v=o.r===me.rid;return{n:nameOf(me,p),fin:v&&o.fin!=null?o.fin:null,prog:v?(o.prog||0):0,mis:v?(o.mis||0):0,out:isOut(me,p)};});
  rows.sort((a,b)=>(a.fin!=null?0:1)-(b.fin!=null?0:1)||(a.fin!=null?a.fin-b.fin:0)||(a.out-b.out)||b.prog-a.prog);
  const hostGone=me.role==='guest'&&!me.peers[me.hostPeer];
  const w=rows.find(r=>r.fin!=null),alive=rows.filter(r=>!r.out).length;
  let end=null;
  if(w)end='🏁 '+esc(w.n)+' ไขเสร็จก่อน ('+fmt(w.fin)+')';
  else if(hostGone)end='เจ้าของห้องออกจากห้องแล้ว';
  else if(rows.length>=2&&alive<=1)end='ผู้เล่นคนอื่นออกจากห้องหมดแล้ว';
  if(end&&!me.over){me.over=true;me.endT=w?w.fin:Math.max(0,Math.floor((Date.now()-(me.go||Date.now()))/1000));}
  const t=me.over?me.endT:Math.max(0,Math.floor((Date.now()-(me.go||Date.now()))/1000));
  const body=(end?'<div class="sbanner">'+end+'</div>':'')+rows.map((r,i)=>'<div class="srow'+(r.fin!=null&&i===0?' win':'')+(r.out?' out':'')+'"><div class="sh"><b>'+esc(r.n)+'</b><em>'+(r.fin!=null?'เสร็จ '+fmt(r.fin):(r.out?'ออกแล้ว':r.prog+'/'+total+(r.mis?' · ผิด '+r.mis:'')))+'</em></div><div class="sbar"><i style="width:'+Math.round((r.fin!=null?total:r.prog)/total*100)+'%"></i></div></div>').join('');
  specPaint(me,'ระดับ'+(C.LEVELS[me.lv]?C.LEVELS[me.lv].name:'')+' · เวลา '+fmt(t),body,end&&me.role==='host'?{label:'เล่นอีกรอบ',fn:startRound}:null);
}
function guestGame(me){
  const host=me.peers[me.hostPeer];
  if(!host||!inRoom(me))return;
  if(isSp(me)){
    if(me.st===1&&host.pz&&host.rid>me.rid){clearTimeout(me.joinTimer);me.rid=host.rid;me.started=true;me.over=false;me.pz=host.pz;me.lv=host.lv;me.go=host.go;sdSpecStart(me);}
    else sdSpecRender(me);
    return;
  }
  if(me.st===1&&host.pz&&host.rid>me.rid){
    const arr=host.pz.split('').map(Number),sol=arr.length===81?C.search(arr,1,false).sol:null;
    if(!sol)return;
    clearTimeout(me.joinTimer);closeModal();
    me.rid=host.rid;me.started=true;me.over=false;me.sentProg=0;me.sentMis=0;
    begin(host.lv,{puzzle:arr,sol},true);
    pres({r:me.rid,prog:0,mis:0,fin:null,rs:null});
  }
  oppUpdate();
}
const MPH={
  start:startRound,
  peers(me,ch){
    if(!mpPeers(me,ch))return;
    if(me.role==='guest')guestGame(me);else if(me.spec)sdSpecRender(me);else oppUpdate();
  }
};
/*==ONLINE-END==*/
$('bHost').onclick=()=>{if(roomNS&&!on)askHostLevel();};
$('bJoin').onclick=()=>{if(roomNS&&!on)askJoin();};

/* ---------- timer / keyboard / lifecycle ---------- */
setInterval(()=>{
  if(!S||S.done||paused||document.hidden||!$('menu').hidden||!$('busy').hidden)return;
  S.time++;$('tm').textContent=fmt(S.time);if(S.time%5===0)save();
},1000);
setInterval(()=>{if(S&&S.online&&!S.done&&on)oppUpdate();else if(on&&on.spec&&on.started)sdSpecRender(on);},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.addEventListener('pagehide',save);
document.addEventListener('keydown',e=>{
  if(!S||!$('menu').hidden||!$('modal').hidden)return;
  const k=e.key;
  if(k>='1'&&k<='9'){input(+k);}
  else if(k==='Backspace'||k==='Delete'||k==='0')erase();
  else if(k==='n'||k==='N'){noteMode=!noteMode;render();}
  else if(k==='h'||k==='H')hint();
  else if((k==='z'||k==='Z')&&(e.ctrlKey||e.metaKey)){e.preventDefault();undo();}
  else if(k.startsWith('Arrow')&&!paused){
    e.preventDefault();let i=sel<0?40:sel,r=C.ROW[i],c=C.COL[i];
    if(k==='ArrowUp')r=(r+8)%9;if(k==='ArrowDown')r=(r+1)%9;if(k==='ArrowLeft')c=(c+8)%9;if(k==='ArrowRight')c=(c+1)%9;
    select(r*9+c);
  }
});
window.__leaveGuard=()=>{
  if(on){
    if(on.spec)return{msg:on.role==='host'?'ห้องจะถูกปิด ผู้เล่นทุกคนจะถูกตัดออก':'คุณจะเลิกดูแมตช์นี้'};
    if(on.started&&!on.over)return{msg:'การออกระหว่างแข่งนับว่ายอมแพ้'};
    if(!on.started)return{msg:'คุณจะออกจากห้องนี้'};
    return null;
  }
  if(S&&!S.done&&S.time>3&&$('menu').hidden)return{msg:'เกมนี้ถูกเซฟไว้ เล่นต่อได้จากเมนู',soft:true};
  return null;
};
window.__leaveNow=()=>{try{if(on){if(on.started&&!on.over&&!on.spec&&S){const st=ls.get('sudoku.pvp.v1')||{w:0,l:0};st.l++;ls.set('sudoku.pvp.v1',st);on.over=true;pres({rs:1});}leaveOnline();}}catch(e){}};
window.__sudoku={get S(){return S;},get on(){return on;},start,input,select,hint,applyHint,undo,erase};
showMenu();initRoom();
})();
</script>
